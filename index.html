def main():
    global SCREEN_W, SCREEN_H, THEME
    pygame.init()
    info = pygame.display.Info()
    SCREEN_W = info.current_w
    SCREEN_H = info.current_h
    try:
        screen = pygame.display.set_mode((SCREEN_W, SCREEN_H), pygame.FULLSCREEN)
        aw, ah = screen.get_size()
        SCREEN_W, SCREEN_H = aw, ah
    except Exception:
        screen = pygame.display.set_mode((SCREEN_W, SCREEN_H))
    pygame.display.set_caption("Network Scanner ULTIMATE V4")
    clock = pygame.time.Clock()
    pygame.mouse.set_visible(False)
    init_fonts()
    user_data = load_user_data()
    THEME = user_data.get("theme", "dark")
    sounds = SoundBank()
    scanner = NetworkScanner(user_data, sounds)
    scanner.ghost_mode = user_data.get("ghost_mode", False)

    buttons = build_buttons()
    top_of_buttons = min(b.rect.y for b in buttons)
    scroll_offset = 0
    pulse = 0
    last_auto = time.time()
    auto_interval = 30
    selected_device = None
    alert_popup_timer = 0

    running = True
    while running:
        pulse += 0.05
        now = time.time()
        if user_data.get("auto_scan", False) and not scanner.scanning:
            if now - last_auto > auto_interval:
                scanner.start_scan()
                scroll_offset = 0
                last_auto = now

        for e in pygame.event.get():
            if e.type == pygame.QUIT:
                running = False
            elif e.type == pygame.KEYDOWN:
                if e.key == pygame.K_ESCAPE:
                    running = False
                elif e.key == pygame.K_a:
                    user_data["auto_scan"] = not user_data.get("auto_scan", False)
                    save_user_data(user_data)
                elif e.key == pygame.K_s and not scanner.scanning:
                    scanner.start_scan()
                    scroll_offset = 0
                    last_auto = now
            elif e.type == pygame.VIDEORESIZE:
                SCREEN_W, SCREEN_H = e.w, e.h
                buttons = build_buttons()
                top_of_buttons = min(b.rect.y for b in buttons)
            elif e.type == pygame.MOUSEWHEEL:
                scroll_offset -= e.y*30
                scroll_offset = max(0, scroll_offset)
            else:
                handled = False
                for b in buttons:
                    if b.handle(e):
                        handled = True
                        a = b.action
                        if a == "scan":
                            if not scanner.scanning:
                                scanner.start_scan()
                                scroll_offset = 0
                                last_auto = now
                        elif a == "stop":
                            scanner.stop_scan()
                        elif a == "export_html":
                            export_html(scanner, user_data)
                        elif a == "export_csv":
                            export_csv(scanner)
                        elif a == "backup":
                            export_backup(scanner, user_data)
                        elif a == "router":
                            show_router_settings(screen, clock, user_data, scanner)
                            buttons = build_buttons()
                            top_of_buttons = min(b.rect.y for b in buttons)
                        elif a == "history":
                            show_history(screen, clock)
                            buttons = build_buttons()
                            top_of_buttons = min(b.rect.y for b in buttons)
                        elif a == "stats":
                            show_stats(screen, clock, scanner, user_data)
                            buttons = build_buttons()
                            top_of_buttons = min(b.rect.y for b in buttons)
                        elif a == "graph":
                            show_network_graph(screen, clock, scanner)
                            buttons = build_buttons()
                            top_of_buttons = min(b.rect.y for b in buttons)
                        elif a == "speed":
                            show_speed_test(screen, clock, scanner)
                            buttons = build_buttons()
                            top_of_buttons = min(b.rect.y for b in buttons)
                        elif a == "help":
                            show_help(screen, clock)
                            buttons = build_buttons()
                            top_of_buttons = min(b.rect.y for b in buttons)
                        elif a == "about":
                            show_about(screen, clock)
                            buttons = build_buttons()
                            top_of_buttons = min(b.rect.y for b in buttons)
                        elif a == "theme":
                            THEME = "light" if THEME == "dark" else "dark"
                            user_data["theme"] = THEME
                            save_user_data(user_data)
                        elif a == "ghost":
                            scanner.ghost_mode = not scanner.ghost_mode
                            user_data["ghost_mode"] = scanner.ghost_mode
                            save_user_data(user_data)
                        elif a == "auto":
                            user_data["auto_scan"] = not user_data.get("auto_scan", False)
                            save_user_data(user_data)
                            last_auto = now
                        elif a == "exit":
                            running = False
                        break
                if not handled and e.type == pygame.MOUSEBUTTONDOWN:
                    mx, my = e.pos
                    rh = max(24, int(SCREEN_H*0.04))
                    for i, dev in enumerate(scanner.devices):
                        ry = getattr(scanner, "_row_y", 200) + i*rh - scroll_offset
                        if ry <= my <= ry + rh:
                            selected_device = dev
                            break
                elif not handled and e.type == pygame.FINGERDOWN:
                    mx, my = e.x*SCREEN_W, e.y*SCREEN_H
                    rh = max(24, int(SCREEN_H*0.04))
                    for i, dev in enumerate(scanner.devices):
                        ry = getattr(scanner, "_row_y", 200) + i*rh - scroll_offset
                        if ry <= my <= ry + rh:
                            selected_device = dev
                            break

        if selected_device is not None:
            if selected_device not in scanner.devices:
                selected_device = None
            else:
                show_device_details(screen, clock, selected_device,
                                    user_data, sounds, scanner)
                selected_device = None
                buttons = build_buttons()
                top_of_buttons = min(b.rect.y for b in buttons)

        if scanner.scanning and scanner.is_done():
            scanner.scanning = False
            scanner.history.append({
                "time": datetime.now().strftime("%Y-%m-%d %H:%M:%S"),
                "event": "scan_complete", "ip": scanner.my_ip,
                "name": f"{len(scanner.devices)} devices",
            })
            save_history(scanner.history)

        if scanner.new_device_alert_timer > 0:
            scanner.new_device_alert_timer -= 1
            alert_popup_timer = 180

        draw_grid_background(screen, SCREEN_W, SCREEN_H)
        is_narrow = SCREEN_W < 900
        title_y = int(SCREEN_H*0.018)
        tf = _FONT_BIG if is_narrow else _FONT_HUGE
        draw_text_neon(screen, "NETWORK SCANNER ULTIMATE",
                       tf, (SCREEN_W//2, title_y), C("cyan"), center=True)

        info_y = title_y + int(SCREEN_H*0.050)
        auto_s = "AUTO:ON" if user_data.get("auto_scan") else "AUTO:OFF"
        if is_narrow:
            info_text = f"{scanner.my_ip or 'N/A'}  •  {auto_s}"
        else:
            info_text = f"IP: {scanner.my_ip or 'N/A'}   Router: {scanner.router_ip or 'N/A'}   {auto_s}   Devices: {len(scanner.devices)}"
        ic = C("green") if user_data.get("auto_scan") else C("blue")
        draw_text_neon(screen, info_text, _FONT_SMALL,
                       (SCREEN_W//2, info_y), ic, center=True, glow=False)

        panel_top = info_y + int(SCREEN_H*0.030)
        panel_bottom = top_of_buttons - int(SCREEN_H*0.012)
        panel_h = max(60, panel_bottom - panel_top)
        sm = int(SCREEN_W*0.025)
        panel_rect = pygame.Rect(sm, panel_top, SCREEN_W - sm*2, panel_h)
        draw_panel(screen, panel_rect)

        pad = max(8, int(panel_rect.w*0.015))
        inner_x = panel_rect.x + pad
        inner_w = panel_rect.w - pad*2

        col_num = inner_x
        col_ip = inner_x + int(inner_w*0.03)
        col_mac = inner_x + int(inner_w*0.18)
        col_vendor = inner_x + int(inner_w*0.38)
        col_type = inner_x + int(inner_w*0.55)
        col_stat = inner_x + int(inner_w*0.85)

        header_y = panel_rect.y + max(5, int(panel_rect.h*0.02))
        headers = [("#", col_num), ("IP", col_ip), ("MAC", col_mac),
                   ("VENDOR", col_vendor), ("TYPE/OS", col_type),
                   ("STATUS", col_stat)]
        for text, x in headers:
            t = _FONT_SMALL.render(text, True, C("purple"))
            screen.blit(t, (x, header_y))
        pygame.draw.line(screen, C("purple"),
                         (inner_x, header_y+18),
                         (inner_x+inner_w, header_y+18), 1)

        prog_y = header_y + 24
        if scanner.scanning:
            ratio = min(1.0, scanner.progress / max(1, scanner.max_progress))
            pygame.draw.rect(screen, (20, 40, 60),
                             (inner_x, prog_y, inner_w, 6), border_radius=4)
            fw = int(inner_w*ratio)
            if fw > 0:
                pc = C("cyan")
                pygame.draw.rect(screen, pc, (inner_x, prog_y, fw, 6), border_radius=4)
            st = f"SCANNING... {int(ratio*100)}%  ({scanner.progress}/{scanner.max_progress})"
        else:
            st = f"DONE — {len(scanner.devices)} devices" if scanner.devices else "READY — press SCAN"
        t = _FONT_SMALL.render(st, True, C("green") if not scanner.scanning else C("cyan"))
        screen.blit(t, (inner_x, prog_y+10))

        list_y = prog_y + 30
        scanner._row_y = list_y
        list_h = panel_rect.bottom - list_y - 5

        if list_h > 20:
            clip = pygame.Rect(panel_rect.x+4, list_y, panel_rect.w-8, list_h)
            old = screen.get_clip()
            screen.set_clip(clip)
            rh = max(22, int(SCREEN_H*0.036))
            for i, dev in enumerate(scanner.devices):
                y = list_y + i*rh - scroll_offset
                if y+rh < list_y or y > list_y+list_h: continue
                if dev["kind"] == "me":
                    rc = C("green"); st2 = "YOU"
                elif dev["kind"] == "router":
                    rc = C("yellow"); st2 = "ROUTER"
                elif dev.get("trusted"):
                    rc = C("blue"); st2 = "TRUSTED"
                else:
                    rc = C("red"); st2 = "UNKNOWN"
                if i % 2 == 0:
                    bg = pygame.Surface((clip.w, rh), pygame.SRCALPHA)
                    bg.fill((*rc, 15))
                    screen.blit(bg, (clip.x, y))
                ty = y + rh//2 - 8
                t = _FONT_MONO.render(str(i+1), True, rc); screen.blit(t, (col_num, ty))
                t = _FONT_MONO.render(dev["ip"], True, C("text")); screen.blit(t, (col_ip, ty))
                t = _FONT_MONO.render(dev["mac"], True, C("text_dim")); screen.blit(t, (col_mac, ty))
                avail = int(inner_w*0.55) - int(inner_w*0.38)
                mc = max(6, avail // max(6, int(SCREEN_W*0.008)))
                ven = dev.get("vendor", "Unknown")
                if len(ven) > mc: ven = ven[:mc-1] + "…"
                t = _FONT_MONO.render(ven, True, C("text_dim")); screen.blit(t, (col_vendor, ty))
                avail2 = int(inner_w*0.85) - int(inner_w*0.55)
                mc2 = max(6, avail2 // max(6, int(SCREEN_W*0.008)))
                tp = dev.get("type", "?")
                os_s = dev.get("os", "")
                tp_display = f"{tp[:mc2//2]} | {os_s[:mc2//2]}"
                if len(tp_display) > mc2: tp_display = tp_display[:mc2-1] + "…"
                nc = C("green") if dev.get("trusted") else C("text_dim")
                t = _FONT_MONO.render(tp_display, True, nc); screen.blit(t, (col_type, ty))
                t = _FONT_MONO.render(st2, True, rc); screen.blit(t, (col_stat, ty))
            screen.set_clip(old)
            if scanner.scanning:
                sly = list_y + int((math.sin(pulse*0.7)+1)/2 * list_h)
                sl = pygame.Surface((clip.w, 2), pygame.SRCALPHA)
                sl.fill((*C("cyan"), 120))
                screen.blit(sl, (clip.x, sly))

        for b in buttons:
            b.draw(screen)

        if alert_popup_timer > 0:
            alert_popup_timer -= 1
            popup = pygame.Surface((int(SCREEN_W*0.6), 70), pygame.SRCALPHA)
            popup.fill((*C("red"), 220))
            screen.blit(popup, (SCREEN_W//2 - popup.get_width()//2, int(SCREEN_H*0.15)))
            t = _FONT_MED.render("! NEW DEVICE DETECTED !", True, (255, 255, 255))
            screen.blit(t, t.get_rect(center=(SCREEN_W//2, int(SCREEN_H*0.15)+25)))
            t = _FONT_SMALL.render(scanner.new_device_mac, True, (255, 255, 255))
            screen.blit(t, t.get_rect(center=(SCREEN_W//2, int(SCREEN_H*0.15)+48)))

        tip = "Tap device for details  •  A=Auto  S=Scan"
        t = _FONT_TINY.render(tip, True, C("text_dim"))
        screen.blit(t, (SCREEN_W//2 - t.get_width()//2, 3))

        pygame.display.flip()
        clock.tick(FPS_TARGET)

    save_user_data(user_data)
    pygame.quit()
    sys.exit()

if __name__ == "__main__":
    main()
  </script>
