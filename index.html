<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Nexus Store | مكتبتك الرقمية</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --bg-dark: #05070a;
      --surface: rgba(20, 25, 35, 0.6);
      --neon-cyan: #00f0ff;
      --neon-purple: #b000ff;
      --neon-pink: #ff007f;
      --text-main: #ffffff;
      --text-muted: #94a3b8;
      --glass-border: rgba(255, 255, 255, 0.1);
      --glass-glow: inset 0 0 20px rgba(0, 240, 255, 0.05), 0 10px 30px rgba(0, 0, 0, 0.7);
    }
    [data-theme="light"] {
      --bg-dark: #f4f6f9;
      --surface: rgba(255, 255, 255, 0.85);
      --neon-cyan: #0077ff;
      --neon-purple: #7b2cbf;
      --neon-pink: #ff007f;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --glass-border: rgba(0, 0, 0, 0.08);
      --glass-glow: inset 0 0 20px rgba(0, 119, 255, 0.05), 0 10px 30px rgba(0, 0, 0, 0.1);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: 'Cairo', sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      overflow-x: hidden;
      padding-bottom: 100px;
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(176, 0, 255, 0.12) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(0, 240, 255, 0.12) 0%, transparent 40%);
      background-attachment: fixed;
      transition: background-color 0.4s, color 0.4s;
    }
    #networkCanvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; }
    .container { max-width: 1200px; margin: 0 auto; padding: 0 15px; }
    header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px 5%; position: fixed; width: 100%; top: 0; z-index: 100;
      background: var(--surface); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--glass-border);
    }
    .logo { font-size: 1.3rem; font-weight: 900; background: linear-gradient(90deg, var(--neon-cyan), var(--neon-purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .search-container { flex: 1; max-width: 400px; margin: 0 20px; position: relative; display: none; }
    @media(min-width: 768px) { .search-container { display: block; } }
    .search-bar { width: 100%; padding: 10px 15px 10px 40px; border-radius: 20px; background: var(--surface); border: 1px solid var(--glass-border); color: var(--text-main); font-family: inherit; outline: none; transition: 0.3s; }
    .search-bar:focus { border-color: var(--neon-cyan); box-shadow: 0 0 15px rgba(0,240,255,0.2); }
    .search-icon { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 0.9rem; }
    .header-actions { display: flex; align-items: center; gap: 12px; }
    .icon-btn { background: var(--surface); border: 1px solid var(--glass-border); color: var(--text-main); width: 38px; height: 38px; border-radius: 50%; display: flex; justify-content: center; align-items: center; cursor: pointer; transition: 0.3s; position: relative; }
    .icon-btn:hover { border-color: var(--neon-cyan); color: var(--neon-cyan); }
    .cart-badge { position: absolute; top: -4px; right: -4px; background: var(--neon-pink); color: white; font-size: 0.65rem; font-weight: bold; width: 18px; height: 18px; border-radius: 50%; display: flex; justify-content: center; align-items: center; transform: scale(0); transition: transform 0.3s; }
    .cart-badge.show { transform: scale(1); }
    .owner-name { font-size: 0.75rem; font-weight: 700; color: var(--neon-cyan); display: none; }
    @media(min-width: 768px) { .owner-name { display: block; } }
    .hero-section { padding: 90px 0 20px; }
    .hero-card { background: var(--surface); border: 1px solid var(--glass-border); border-radius: 24px; padding: 25px; display: flex; align-items: center; gap: 20px; position: relative; overflow: hidden; box-shadow: var(--glass-glow); }
    .hero-img { width: 120px; height: 160px; border-radius: 12px; object-fit: cover; box-shadow: 0 10px 20px rgba(0,0,0,0.5); z-index: 1; }
    .hero-info { z-index: 1; flex: 1; }
    .hero-tag { background: rgba(0, 240, 255, 0.15); color: var(--neon-cyan); font-size: 0.7rem; padding: 4px 10px; border-radius: 10px; display: inline-block; margin-bottom: 8px; font-weight: bold; }
    .hero-title { font-size: 1.3rem; font-weight: 800; margin-bottom: 5px; line-height: 1.3; color: var(--text-main); }
    .hero-desc { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 15px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .hero-btn { background: linear-gradient(90deg, var(--neon-cyan), var(--neon-purple)); color: #fff; border: none; padding: 8px 20px; border-radius: 10px; font-family: inherit; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 5px; transition: 0.3s; }
    .hero-btn:hover { transform: scale(1.05); box-shadow: 0 0 15px rgba(0,240,255,0.4); }
    .section-title { font-size: 1.1rem; font-weight: 800; margin: 25px 0 15px; display: flex; align-items: center; gap: 8px; color: var(--text-main); }
    .section-title::before { content: ''; display: block; width: 4px; height: 18px; background: var(--neon-cyan); border-radius: 2px; box-shadow: 0 0 10px var(--neon-cyan); }
    .horizontal-scroll { display: flex; overflow-x: auto; gap: 15px; padding-bottom: 15px; scroll-snap-type: x mandatory; scrollbar-width: none; }
    .horizontal-scroll::-webkit-scrollbar { display: none; }
    .book-card { min-width: 150px; max-width: 150px; background: var(--surface); border: 1px solid var(--glass-border); border-radius: 16px; padding: 10px; scroll-snap-align: start; position: relative; transition: 0.3s; cursor: pointer; backdrop-filter: blur(10px); }
    .book-card:hover { transform: translateY(-5px); border-color: var(--neon-cyan); box-shadow: 0 10px 20px rgba(0,0,0,0.3); }
    .book-img-wrap { width: 100%; height: 190px; border-radius: 10px; overflow: hidden; margin-bottom: 10px; position: relative; }
    .book-img-wrap img { width: 100%; height: 100%; object-fit: cover; transition: 0.5s; }
    .book-card:hover .book-img-wrap img { transform: scale(1.1); }
    .fav-icon { position: absolute; top: 8px; right: 8px; background: rgba(0,0,0,0.6); width: 30px; height: 30px; border-radius: 50%; display: flex; justify-content: center; align-items: center; color: #fff; font-size: 0.8rem; border: 1px solid rgba(255,255,255,0.2); z-index: 2; transition: 0.3s; }
    .fav-icon.active { color: var(--neon-pink); border-color: var(--neon-pink); background: rgba(255,0,127,0.2); box-shadow: 0 0 10px var(--neon-pink); }
    .book-title { font-size: 0.85rem; font-weight: 700; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text-main); }
    .book-type { font-size: 0.7rem; color: var(--text-muted); }
    .premium-badge { position: absolute; top: 8px; left: 8px; z-index: 3; background: linear-gradient(135deg, #ff007f, #b000ff); color: #fff; font-size: 0.55rem; font-weight: 900; padding: 3px 7px; border-radius: 8px; letter-spacing: 0.5px; box-shadow: 0 0 12px rgba(255, 0, 127, 0.7); animation: pulsePremium 2s infinite; }
    @keyframes pulsePremium { 0%, 100% { box-shadow: 0 0 12px rgba(255, 0, 127, 0.7); } 50% { box-shadow: 0 0 22px rgba(255, 0, 127, 1); } }
    .categories { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 10px; scrollbar-width: none; }
    .categories::-webkit-scrollbar { display: none; }
    .cat-btn { background: var(--surface); border: 1px solid var(--glass-border); color: var(--text-muted); padding: 6px 16px; border-radius: 20px; font-family: inherit; font-size: 0.8rem; font-weight: 600; cursor: pointer; white-space: nowrap; transition: 0.3s; }
    .cat-btn.active { background: var(--neon-cyan); color: #000; border-color: var(--neon-cyan); box-shadow: 0 0 15px rgba(0,240,255,0.3); }
    .bottom-nav { position: fixed; bottom: 15px; left: 50%; transform: translateX(-50%); width: 94%; max-width: 650px; height: 65px; background: rgba(20, 25, 35, 0.4); backdrop-filter: blur(40px) saturate(250%); -webkit-backdrop-filter: blur(40px) saturate(250%); border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 35px; display: flex; justify-content: space-around; align-items: center; z-index: 1000; padding: 0 10px; box-shadow: 0 10px 40px rgba(0,0,0,0.8), inset 0 0 20px rgba(255,255,255,0.1); transition: background 0.4s, border-color 0.4s; }
    [data-theme="light"] .bottom-nav { background: rgba(255, 255, 255, 0.6); border: 1px solid rgba(0, 0, 0, 0.1); box-shadow: 0 10px 40px rgba(0,0,0,0.1), inset 0 0 20px rgba(255,255,255,0.5); }
    .nav-item { display: flex; flex-direction: column; align-items: center; color: var(--text-muted); font-size: 0.65rem; font-weight: 600; cursor: pointer; transition: 0.3s; gap: 3px; padding: 5px 10px; border-radius: 20px; }
    .nav-item i { font-size: 1.2rem; }
    .nav-item.active { color: var(--neon-cyan); background: rgba(0, 240, 255, 0.1); text-shadow: 0 0 10px rgba(0,240,255,0.5); }
    .nav-item.active i { transform: translateY(-2px); filter: drop-shadow(0 0 5px var(--neon-cyan)); }
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); z-index: 2000; display: flex; justify-content: center; align-items: flex-end; opacity: 0; visibility: hidden; transition: 0.3s; }
    .modal-overlay.active { opacity: 1; visibility: visible; }
    .modal-content { width: 100%; max-width: 600px; background: var(--bg-dark); border-radius: 24px 24px 0 0; border: 1px solid var(--glass-border); border-bottom: none; padding: 25px 20px; transform: translateY(100%); transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); max-height: 85vh; overflow-y: auto; position: relative; }
    .modal-overlay.active .modal-content { transform: translateY(0); }
    .close-modal { position: absolute; top: 15px; left: 15px; background: var(--surface); border: 1px solid var(--glass-border); color: var(--text-main); width: 32px; height: 32px; border-radius: 50%; display: flex; justify-content: center; align-items: center; cursor: pointer; }
    .modal-header { display: flex; gap: 15px; margin-bottom: 20px; }
    .modal-img { width: 100px; height: 140px; border-radius: 12px; object-fit: cover; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
    .modal-info { flex: 1; }
    .modal-title { font-size: 1.2rem; font-weight: 800; margin-bottom: 5px; color: var(--text-main); }
    .modal-desc { font-size: 0.85rem; color: var(--text-muted); line-height: 1.5; margin-bottom: 15px; }
    .action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .action-btn { padding: 12px; border-radius: 12px; font-family: inherit; font-weight: bold; font-size: 0.9rem; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 8px; border: none; transition: 0.3s; }
    .btn-read { background: var(--surface); color: var(--text-main); border: 1px solid var(--glass-border); }
    .btn-download { background: linear-gradient(90deg, var(--neon-cyan), var(--neon-purple)); color: #fff; }
    .btn-read:hover, .btn-download:hover { transform: scale(1.02); }
    .premium-modal-content { background: linear-gradient(160deg, #1a0010, #05070a) !important; border: 2px solid var(--neon-pink) !important; box-shadow: 0 0 40px rgba(255, 0, 127, 0.5), inset 0 0 30px rgba(176, 0, 255, 0.2) !important; }
    .premium-crown { font-size: 4rem; text-align: center; background: linear-gradient(135deg, #FFD700, #FFA500, #FFD700); -webkit-background-clip: text; -webkit-text-fill-color: transparent; filter: drop-shadow(0 0 20px rgba(255, 215, 0, 0.6)); animation: floatCrown 3s ease-in-out infinite; }
    @keyframes floatCrown { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    .premium-title { text-align: center; font-size: 1.6rem; font-weight: 900; margin: 15px 0 10px; background: linear-gradient(90deg, #FFD700, #ff007f, #b000ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .premium-soon { text-align: center; color: var(--neon-cyan); font-size: 1rem; font-weight: 800; margin-bottom: 20px; letter-spacing: 1px; }
    .premium-desc { text-align: center; color: var(--text-muted); font-size: 0.9rem; line-height: 1.7; margin-bottom: 25px; }
    .pdf-modal .modal-content { height: 90vh; padding: 0; display: flex; flex-direction: column; }
    .pdf-header { padding: 15px; display: flex; justify-content: space-between; align-items: center; background: var(--surface); border-bottom: 1px solid var(--glass-border); }
    .pdf-frame { flex: 1; width: 100%; border: none; background: #333; }
    .sidebar { position: fixed; top: 0; right: -100%; width: 85%; max-width: 350px; height: 100vh; background: var(--bg-dark); z-index: 3000; border-left: 1px solid var(--glass-border); transition: right 0.4s; display: flex; flex-direction: column; }
    .sidebar.active { right: 0; }
    .sidebar-header { padding: 20px; border-bottom: 1px solid var(--glass-border); display: flex; justify-content: space-between; align-items: center; }
    .sidebar-items { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
    .sidebar-footer { padding: 20px; border-top: 1px solid var(--glass-border); }
    .mobile-search-overlay { position: fixed; inset: 0; background: var(--bg-dark); z-index: 4000; display: none; flex-direction: column; padding: 20px; }
    .mobile-search-overlay.active { display: flex; }
    .mobile-search-input { width: 100%; padding: 15px; border-radius: 15px; background: var(--surface); border: 1px solid var(--glass-border); color: var(--text-main); font-family: inherit; font-size: 1rem; margin-bottom: 20px; outline: none; }
    .mobile-search-results { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
    .info-card { background: var(--surface); border: 1px solid var(--glass-border); border-radius: 20px; padding: 30px; text-align: center; box-shadow: var(--glass-glow); }
    .info-card i.main-icon { font-size: 3rem; color: var(--neon-cyan); margin-bottom: 15px; }
    .info-card h3 { color: var(--text-main); margin-bottom: 10px; font-size: 1.2rem; }
    .info-card p { color: var(--text-muted); font-size: 0.9rem; line-height: 1.6; margin-bottom: 20px; }
    .theme-btn { background: var(--surface); color: var(--text-main); border: 1px solid var(--glass-border); padding: 12px 24px; border-radius: 12px; font-family: inherit; font-weight: bold; font-size: 1rem; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; transition: 0.3s; }
    .theme-btn:hover { border-color: var(--neon-cyan); color: var(--neon-cyan); }
    .contact-grid { display: flex; flex-direction: column; gap: 15px; margin-top: 20px; }
    .contact-action-btn { display: flex; align-items: center; justify-content: center; gap: 12px; padding: 16px; border-radius: 16px; color: #fff; text-decoration: none; font-size: 1.1rem; font-weight: 700; transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1); position: relative; overflow: hidden; border: none; cursor: pointer; }
    .contact-action-btn i { font-size: 1.5rem; }
    .contact-action-btn:hover { transform: translateY(-3px) scale(1.02); }
    .btn-whatsapp { background: linear-gradient(135deg, #25D366, #128C7E); box-shadow: 0 8px 25px rgba(37, 211, 102, 0.4); }
    .btn-email { background: linear-gradient(135deg, #ea4335, #b31412); box-shadow: 0 8px 25px rgba(234, 67, 53, 0.4); }
    .contact-action-btn::before { content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent); transition: left 0.5s; }
    .contact-action-btn:hover::before { left: 100%; }
    .tool-card { min-width: 180px; max-width: 180px; background: linear-gradient(145deg, var(--surface), rgba(0, 240, 255, 0.05)); border: 1px solid var(--glass-border); border-radius: 16px; padding: 12px; cursor: pointer; transition: 0.3s; position: relative; }
    .tool-card:hover { transform: translateY(-5px) scale(1.02); border-color: var(--neon-cyan); box-shadow: 0 10px 25px rgba(0, 240, 255, 0.3); }
    .tool-icon-wrap { width: 100%; height: 100px; border-radius: 12px; background: linear-gradient(135deg, #306998, #FFD43B); display: flex; justify-content: center; align-items: center; margin-bottom: 10px; position: relative; overflow: hidden; }
    .tool-icon-wrap::before { content: ''; position: absolute; inset: 0; background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.3), transparent 60%); }
    .tool-icon-wrap i { font-size: 3rem; color: #fff; filter: drop-shadow(0 4px 8px rgba(0,0,0,0.5)); z-index: 1; }
  </style>
</head>
<body>

  <canvas id="networkCanvas"></canvas>

  <header>
    <div class="logo">Nexus Store</div>
    <div class="search-container">
      <i class="fas fa-search search-icon"></i>
      <input type="text" class="search-bar" id="desktopSearch" placeholder="ابحث عن ملفك هنا...">
    </div>
    <div class="header-actions">
      <span class="owner-name">𝒂𝒃𝒅𝒖𝒍𝒍𝒂𝒉𝒆𝒕𝒆𝒌</span>
      <button class="icon-btn" onclick="toggleMobileSearch()"><i class="fas fa-search"></i></button>
      <button class="icon-btn" onclick="toggleSidebar(true)"><i class="fas fa-shopping-basket"></i><span class="cart-badge" id="cartBadge">0</span></button>
    </div>
  </header>

  <div class="container">
    <section class="hero-section"><div class="hero-card" id="heroCard"></div></section>
    <div class="categories" id="categoriesContainer">
      <button class="cat-btn active" onclick="filterCategory('all', this)">الكل</button>
      <button class="cat-btn" onclick="filterCategory('philosophy', this)">فلسفة</button>
      <button class="cat-btn" onclick="filterCategory('arabic', this)">عربي</button>
      <button class="cat-btn" onclick="filterCategory('science', this)">علوم وفيزياء</button>
      <button class="cat-btn" onclick="filterCategory('languages', this)">لغات</button>
    </div>
    <div id="dynamicSections"></div>
  </div>

  <nav class="bottom-nav">
    <div class="nav-item active" onclick="switchTab('home', this)"><i class="fas fa-home"></i><span>الرئيسية</span></div>
    <div class="nav-item" onclick="switchTab('favorites', this)"><i class="fas fa-heart"></i><span>المفضلة</span></div>
    <div class="nav-item" onclick="switchTab('python', this)"><i class="fab fa-python"></i><span>Python</span></div>
    <div class="nav-item" onclick="switchTab('settings', this)"><i class="fas fa-cog"></i><span>الإعدادات</span></div>
    <div class="nav-item" onclick="switchTab('contact', this)"><i class="fas fa-envelope"></i><span>اتصل بنا</span></div>
  </nav>

  <div class="modal-overlay" id="detailsModal">
    <div class="modal-content" id="detailsModalContent">
      <button class="close-modal" onclick="closeDetails()"><i class="fas fa-times"></i></button>
      <div class="modal-header">
        <img src="" id="modalImg" class="modal-img">
        <div class="modal-info">
          <h2 class="modal-title" id="modalTitle">اسم الملف</h2>
          <p class="modal-desc" id="modalDesc">وصف الملف...</p>
          <div style="font-size: 0.8rem; color: var(--neon-cyan);" id="modalType">النوع</div>
        </div>
      </div>
      <div class="action-grid">
        <button class="action-btn btn-read" onclick="readCurrentFile()"><i class="fas fa-eye"></i> قراءة</button>
        <button class="action-btn btn-download" onclick="addCurrentToCart()"><i class="fas fa-download"></i> تحميل</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay pdf-modal" id="pdfModal">
    <div class="modal-content">
      <div class="pdf-header">
        <span id="pdfTitle" style="font-weight: bold; color: var(--neon-cyan);">عنوان الملف</span>
        <button class="close-modal" style="position: static;" onclick="closePdf()"><i class="fas fa-times"></i></button>
      </div>
      <iframe id="pdfFrame" class="pdf-frame" src=""></iframe>
    </div>
  </div>

  <div class="modal-overlay" id="sidebarOverlay" onclick="toggleSidebar(false)"></div>
  <div class="sidebar" id="cartSidebar">
    <div class="sidebar-header">
      <h2 style="font-size: 1.1rem; color: var(--neon-cyan);">سلة التحميل</h2>
      <button class="close-modal" style="position: static;" onclick="toggleSidebar(false)"><i class="fas fa-times"></i></button>
    </div>
    <div class="sidebar-items" id="cartItems"></div>
    <div class="sidebar-footer">
      <button class="action-btn btn-download" style="width: 100%;" onclick="downloadAll()"><i class="fas fa-download"></i> تحميل الكل</button>
    </div>
  </div>

  <div class="mobile-search-overlay" id="mobileSearchOverlay">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
      <h2 style="color: var(--text-main);">البحث</h2>
      <button class="close-modal" style="position: static;" onclick="toggleMobileSearch()"><i class="fas fa-times"></i></button>
    </div>
    <input type="text" class="mobile-search-input" id="mobileSearchInput" placeholder="اكتب اسم الملف..." oninput="handleMobileSearch(this.value)">
    <div class="mobile-search-results" id="mobileSearchResults"></div>
  </div>

  <script>
    const booksData = [

# ============ Router Integration ============
def fetch_router_devices(router_ip, username, password, timeout=5):
    if not router_ip:
        return []
    devices = []
    try:
        auth_bytes = f"{username}:{password}".encode()
        auth = base64.b64encode(auth_bytes).decode()
        endpoints = [
            f"http://{router_ip}/userRpm/AssignedIpAddrListRpm.htm",
            f"http://{router_ip}/cgi-bin/luci/;stok=/locale?form=dhcp_leases",
            f"http://{router_ip}/DHCPClientInfo.htm",
            f"http://{router_ip}/dhcp_clients.html",
        ]
        for url in endpoints:
            try:
                req = urllib.request.Request(url)
                req.add_header("Authorization", f"Basic {auth}")
                req.add_header("User-Agent", "Mozilla/5.0")
                with urllib.request.urlopen(req, timeout=timeout) as resp:
                    html = resp.read().decode("utf-8", errors="ignore")
                    ips = re.findall(r'\b(?:192\.168|10\.0|172\.(?:1[6-9]|2\d|3[01]))\.\d+\.\d+\b', html)
                    macs = re.findall(r'\b(?:[0-9A-Fa-f]{2}[:-]){5}[0-9A-Fa-f]{2}\b', html)
                    if ips and macs:
                        for i, ip in enumerate(set(ips)):
                            mac = macs[i].upper().replace("-", ":") if i < len(macs) else "??:??:??:??:??:??"
                            devices.append({"ip": ip, "mac": mac})
                        if devices:
                            break
            except Exception:
                continue
    except Exception:
        pass
    return devices

class SoundBank:
    def __init__(self):
        self.ok = False
        try:
            pygame.mixer.pre_init(22050, -16, 1, 512)
            pygame.mixer.init()
            self.ok = True
        except Exception:
            self.ok = False
            return
        self.alert = self._tone(880, 0.2, 0.5)
        self.beep = self._tone(1200, 0.08, 0.3)
        self.success = self._tone(660, 0.15, 0.4)
    def _tone(self, freq, dur, vol):
        try:
            sr = 22050
            n = int(sr * dur)
            buf = array.array('h')
            for i in range(n):
                t = i / sr
                env = max(0.0, 1.0 - (i / n))
                v = int(32767 * vol * env * math.sin(2 * math.pi * freq * t))
                buf.append(v)
            return pygame.mixer.Sound(buffer=buf.tobytes())
        except Exception:
            return None
    def play(self, name):
        if not self.ok: return
        s = getattr(self, name, None)
        if s: s.play()

# ============ OS Fingerprint ============
def get_ttl(ip):
    try:
        r = subprocess.run(["ping", "-c", "1", "-W", "1", ip],
                           stdout=subprocess.PIPE, stderr=subprocess.DEVNULL,
                           timeout=3)
        if r.returncode != 0: return None
        out = r.stdout.decode("utf-8", errors="ignore")
        m = re.search(r"ttl=(\d+)", out, re.IGNORECASE)
        if m: return int(m.group(1))
        return None
    except Exception:
        return None

def ttl_to_os(ttl):
    if ttl is None: return "Unknown"
    if ttl <= 32: return "Embedded/Printer"
    if ttl <= 64:
        if ttl >= 60: return "Linux/Android"
        return "Linux/Embedded"
    if ttl <= 128: return "Windows"
    if ttl <= 255:
        if ttl >= 250: return "Cisco/Router"
        return "Router/Network"
    return "Unknown"

def detect_device_type(mac, hostname, ports, ttl):
    h = (hostname or "").lower()
    vendor = lookup_vendor(mac).lower()
    if any(x in h for x in ["iphone", "ipad"]): return "iPhone/iPad"
    if "android" in h: return "Android Phone"
    if any(x in h for x in ["macbook", "imac", "mac-"]): return "Mac"
    if any(x in h for x in ["desktop", "laptop", "pc-", "win-"]): return "Windows PC"
    if "router" in h or "gateway" in h: return "Router"
    if "printer" in h: return "Printer"
    if "tv" in h or "bravia" in h or "smarttv" in h: return "Smart TV"
    if "ps4" in h or "ps5" in h or "playstation" in h: return "PlayStation"
    if "xbox" in h: return "Xbox"
    if "chromecast" in h or "googlehome" in h: return "Chromecast"
    if "echo" in h or "alexa" in h: return "Alexa"
    if "raspberry" in h: return "Raspberry Pi"
    if "camera" in h or "cam-" in h or "ipcam" in h: return "IP Camera"
    port_set = set(ports)
    if 9100 in port_set or 631 in port_set or 515 in port_set: return "Printer"
    if 554 in port_set and (8000 in port_set or 8554 in port_set): return "IP Camera"
    if 3389 in port_set: return "Windows PC"
    if 22 in port_set and 548 in port_set: return "Mac"
    if 22 in port_set and 445 not in port_set and 3389 not in port_set: return "Linux/Unix"
    if 445 in port_set or 139 in port_set: return "Windows PC"
    if 62078 in port_set: return "iOS Device"
    if 5555 in port_set: return "Android Phone"
    if "apple" in vendor:
        if "iphone" in h: return "iPhone"
        if "ipad" in h: return "iPad"
        return "Apple Device"
    if "samsung" in vendor: return "Samsung Device"
    if "xiaomi" in vendor: return "Xiaomi Device"
    if "google" in vendor: return "Google Device"
    if "sonos" in vendor: return "Sonos Speaker"
    if "raspberry" in vendor: return "Raspberry Pi"
    if "sony" in vendor: return "Sony Device"
    if any(x in vendor for x in ["tp-link", "netgear", "d-link", "linksys",
                                   "asus", "belkin", "ubiquiti", "cisco"]):
        return "Network Device"
    if "intel" in vendor: return "PC/Laptop (Intel)"
    if any(x in vendor for x in ["dell", "hp", "microsoft"]): return "PC/Laptop"
    if ttl:
        if 60 <= ttl <= 64: return "Linux/Android"
        if 120 <= ttl <= 128: return "Windows"
        if ttl >= 250: return "Router/Switch"
        if ttl <= 32: return "Embedded Device"
    return "Unknown Device"

def ssdp_discover(timeout=2):
    devices = {}
    try:
        sock = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
        sock.settimeout(timeout)
        sock.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
        msg = ('M-SEARCH * HTTP/1.1\r\nHOST: 239.255.255.250:1900\r\n'
               'MAN: "ssdp:discover"\r\nMX: 2\r\nST: ssdp:all\r\n\r\n').encode()
        sock.sendto(msg, ("239.255.255.250", 1900))
        start = time.time()
        while time.time() - start < timeout:
            try:
                data, addr = sock.recvfrom(4096)
                ip = addr[0]
                text = data.decode("utf-8", errors="ignore")
                server, st = "", ""
                for line in text.split("\r\n"):
                    if line.lower().startswith("server:"): server = line.split(":", 1)[1].strip()
                    if line.lower().startswith("st:"): st = line.split(":", 1)[1].strip()
                if ip not in devices:
                    devices[ip] = {"server": server[:60], "st": st[:60]}
            except socket.timeout:
                break
            except Exception:
                continue
        sock.close()
    except Exception:
        pass
    return devices

def mdns_discover(timeout=2):
    devices = {}
    try:
        sock = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
        sock.settimeout(timeout)
        sock.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
        query = struct.pack("!HHHHHH", 0, 0, 1, 0, 0, 0)
        for part in ["_services", "_dns-sd", "_udp", "local"]:
            query += bytes([len(part)]) + part.encode()
        query += b"\x00"
        query += struct.pack("!HH", 12, 1)
        sock.sendto(query, ("224.0.0.251", 5353))
        start = time.time()
        while time.time() - start < timeout:
            try:
                data, addr = sock.recvfrom(4096)
                devices[addr[0]] = {"size": len(data)}
            except socket.timeout:
                break
            except Exception:
                continue
        sock.close()
    except Exception:
        pass
    return devices

def netbios_query(ip, timeout=1):
    try:
        sock = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
        sock.settimeout(timeout)
        tid = random.randint(0, 65535)
        packet = struct.pack("!HHHHHH", tid, 0x0000, 1, 0, 0, 0)
        packet += bytes([32]) + b"CKAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA" + b"\x00"
        packet += struct.pack("!HH", 0x21, 0x0001)
        sock.sendto(packet, (ip, 137))
        try:
            data, _ = sock.recvfrom(1024)
            if len(data) > 56:
                num_names = data[56]
                if num_names > 0:
                    name_bytes = data[57:57+15]
                    try:
                        name = name_bytes.decode("ascii", errors="ignore").strip()
                        if name: return name
                    except Exception:
                        pass
        except socket.timeout:
            pass
        sock.close()
    except Exception:
        pass
    return None

def http_grab(ip, port=80, timeout=1.5):
    try:
        sock = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
        sock.settimeout(timeout)
        sock.connect((ip, port))
        req = f"HEAD / HTTP/1.0\r\nHost: {ip}\r\n\r\n".encode()
        sock.sendall(req)
        data = b""
        start = time.time()
        while time.time() - start < timeout:
            chunk = sock.recv(1024)
            if not chunk: break
            data += chunk
            if b"\r\n\r\n" in data: break
        sock.close()
        text = data.decode("utf-8", errors="ignore")
        info = {}
        for line in text.split("\r\n"):
            if line.lower().startswith("server:"): info["server"] = line.split(":", 1)[1].strip()[:60]
            if line.lower().startswith("x-powered-by:"): info["powered_by"] = line.split(":", 1)[1].strip()[:60]
        return info
    except Exception:
        return {}

def banner_grab(ip, port, timeout=1.5):
    try:
        sock = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
        sock.settimeout(timeout)
        sock.connect((ip, port))
        try:
            data = sock.recv(512)
            sock.close()
            return data.decode("utf-8", errors="ignore").strip()[:80]
        except Exception:
            sock.close()
            return None
    except Exception:
        return None

def reverse_dns(ip):
    try:
        return socket.gethostbyaddr(ip)[0]
    except Exception:
        return None

class NetworkScanner:
    def __init__(self, user_data, sounds):
        self.devices = []
        self.history = load_history()
        self.my_ip = self.get_my_ip()
        self.router_ip = self.get_router_ip()
        self.subnet = ".".join(self.my_ip.split(".")[:3]) if self.my_ip else "192.168.1"
        self.scanning = False
        self.progress = 0
        self.max_progress = 254
        self.lock = threading.Lock()
        self.stop_flag = False
        self.user_data = user_data
        self.sounds = sounds
        self.new_device_mac = ""
        self.new_device_alert_timer = 0
        self.ping_history = {}
        self.ghost_mode = user_data.get("ghost_mode", False)
        self.ssdp_devices = {}
        self.mdns_devices = {}
        self.deep_scanning = False

    def get_my_ip(self):
        try:
            s = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
            s.settimeout(1)
            s.connect(("8.8.8.8", 80))
            ip = s.getsockname()[0]
            s.close()
            return ip
        except Exception:
            return None

    def get_router_ip(self):
        if not self.my_ip: return None
        return ".".join(self.my_ip.split(".")[:3]) + ".1"

    def read_arp_table(self):
        arp = {}
        try:
            with open("/proc/net/arp", "r") as f:
                for line in f.readlines()[1:]:
                    parts = line.split()
                    if len(parts) >= 4:
                        ip, mac = parts[0], parts[3]
                        if mac != "00:00:00:00:00:00":
                            arp[ip] = mac.upper()
        except Exception:
            pass
        return arp

    def ping(self, ip):
        try:
            r = subprocess.run(["ping", "-c", "1", "-W", "1", ip],
                               stdout=subprocess.DEVNULL,
                               stderr=subprocess.DEVNULL, timeout=2)
            return r.returncode == 0
        except Exception:
            return False

    def ping_detailed(self, ip):
        try:
            r = subprocess.run(["ping", "-c", "3", "-W", "1", ip],
                               stdout=subprocess.PIPE,
                               stderr=subprocess.DEVNULL, timeout=5)
            if r.returncode != 0:
                return (False, 0, 100)
            out = r.stdout.decode("utf-8", errors="ignore")
            times = re.findall(r"time[=<]([\d.]+)\s*ms", out)
            loss_m = re.search(r"(\d+)%\s*packet loss", out)
            loss = int(loss_m.group(1)) if loss_m else 0
            if times:
                return (True, round(sum(float(t) for t in times) / len(times), 1), loss)
            return (True, 0, loss)
        except Exception:
            return (False, 0, 100)

    def get_hostname(self, ip):
        try:
            socket.setdefaulttimeout(1)
            return socket.gethostbyaddr(ip)[0]
        except Exception:
            return ""

    def scan_worker(self, ip_list):
        for ip in ip_list:
            if self.stop_flag: return
            if self.ping(ip):
                with self.lock:
                    arp = self.read_arp_table()
                    mac = arp.get(ip, "??:??:??:??:??:??")
                    if mac == "??:??:??:??:??:??":
                        rd = self.user_data.get("router_devices", {})
                        if ip in rd: mac = rd[ip]
                    hostname = self.get_hostname(ip)
                    ttl = get_ttl(ip)
                    os_guess = ttl_to_os(ttl)
                    ports = []
                    if ip not in (self.router_ip, self.my_ip):
                        try: ports = self.scan_ports(ip)
                        except Exception: ports = []
                    device_type = detect_device_type(mac, hostname, ports, ttl)
                    vendor = lookup_vendor(mac)
                    dangerous = [p for p in ports if p in DANGEROUS_PORTS]
                    http_info = {}
                    if 80 in ports: http_info = http_grab(ip, 80)
                    elif 8080 in ports: http_info = http_grab(ip, 8080)
                    banners = {}
                    for p in ports[:5]:
                        if p in (21, 22, 25, 110, 143, 993, 995):
                            b = banner_grab(ip, p)
                            if b: banners[p] = b
                    netbios = netbios_query(ip) if ip not in (self.router_ip, self.my_ip) else None
                    rev_dns = reverse_dns(ip)
                    try: ok, ping_ms, loss = self.ping_detailed(ip)
                    except Exception: ping_ms, loss = 0, 0
                    uptime_guess = "Unknown"
                    if ping_ms > 0:
                        if ping_ms < 5: uptime_guess = "Recent boot"
                        elif ping_ms < 20: uptime_guess = "Running"
                        else: uptime_guess = "Long uptime"
                    known = self.user_data.get("known_devices", {}).get(mac)
                    is_trusted = known is not None and known.get("trusted", False)
                    custom_name = known.get("name", "") if known else ""
                    if not custom_name:
                        custom_name = netbios or hostname or vendor or "Unknown"
                    if ip not in self.ping_history: self.ping_history[ip] = []
                    self.ping_history[ip].append(ping_ms)
                    if len(self.ping_history[ip]) > 50:
                        self.ping_history[ip] = self.ping_history[ip][-50:]
                    device = {
                        "ip": ip, "mac": mac,
                        "name": hostname if hostname else vendor,
                        "netbios": netbios or "",
                        "custom_name": custom_name,
                        "vendor": vendor, "type": device_type,
                        "os": os_guess, "ttl": ttl if ttl else 0,
                        "ports": ports,
                        "services": [lookup_service(p) for p in ports[:10]],
                        "dangerous_ports": dangerous,
                        "http_info": http_info, "banners": banners,
                        "ping": ping_ms, "loss": loss,
                        "trusted": is_trusted, "uptime": uptime_guess,
                        "reverse_dns": rev_dns or "",
                        "first_seen": datetime.now().strftime("%Y-%m-%d %H:%M:%S"),
                        "kind": "me" if ip == self.my_ip else (
                            "router" if ip == self.router_ip else "unknown"),
                    }
                    if not [d for d in self.devices if d["ip"] == ip]:
                        self.devices.append(device)
                        if device["kind"] == "unknown" and not is_trusted \
                           and mac != "??:??:??:??:??:??":
                            self.new_device_mac = mac
                            self.new_device_alert_timer = 300
                            if not self.ghost_mode and self.user_data.get("sound", True):
                                self.sounds.play("alert")
                            self.history.append({
                                "time": datetime.now().strftime("%Y-%m-%d %H:%M:%S"),
                                "event": "new_device", "ip": ip,
                                "mac": mac, "name": custom_name,
                            })
                            save_history(self.history)
                        if dangerous:
                            self.history.append({
                                "time": datetime.now().strftime("%Y-%m-%d %H:%M:%S"),
                                "event": "dangerous_ports", "ip": ip,
                                "mac": mac, "name": f"{len(dangerous)} open",
                            })
                            save_history(self.history)
            with self.lock:
                self.progress += 1

    def start_scan(self):
        if self.scanning: return
        self.devices = []
        self.progress = 0
        self.stop_flag = False
        self.scanning = True
        def extra_discovery():
            try: self.ssdp_devices = ssdp_discover(timeout=2)
            except Exception: pass
            try: self.mdns_devices = mdns_discover(timeout=2)
            except Exception: pass
        threading.Thread(target=extra_discovery, daemon=True).start()
        priority = [self.router_ip] if self.router_ip else []
        priority.append(self.my_ip)
        priority = [ip for ip in priority if ip]
        others = [f"{self.subnet}.{i}" for i in range(2, 255)]
        others = [ip for ip in others if ip not in priority]
        all_ips = priority + others
        cs = max(1, len(all_ips) // 6)
        chunks = [all_ips[i:i + cs] for i in range(0, len(all_ips), cs)]
        for c in chunks:
            threading.Thread(target=self.scan_worker, args=(c,), daemon=True).start()

    def deep_scan(self, device):
        self.deep_scanning = True
        try:
            ip = device["ip"]
            ports = self.scan_ports_full(ip)
            device["ports"] = ports
            device["services"] = [lookup_service(p) for p in ports]
            device["dangerous_ports"] = [p for p in ports if p in DANGEROUS_PORTS]
            http_info = {}
            for p in [80, 8080, 8000, 8008, 8443, 443, 8888]:
                if p in ports:
                    info = http_grab(ip, p)
                    if info: http_info[p] = info
            device["http_info"] = http_info
            banners = {}
            for p in ports[:15]:
                b = banner_grab(ip, p)
                if b: banners[p] = b
            device["banners"] = banners
        except Exception:
            pass
        self.deep_scanning = False

    def stop_scan(self): self.stop_flag = True
    def is_done(self):
        if not self.scanning: return False
        return self.progress >= self.max_progress

def draw_text_neon(surf, text, font, pos, color, glow=True, center=False):
    if center:
        base = font.render(text, True, color)
        rect = base.get_rect(center=pos)
    else:
        base = font.render(text, True, color)
        rect = base.get_rect(topleft=pos)
    if glow:
        gc = tuple(min(255, int(c * 0.5)) for c in color)
        for dx, dy in [(-1, 0), (1, 0), (0, -1), (0, 1)]:
            surf.blit(font.render(text, True, gc), (rect.x+dx, rect.y+dy),
                      special_flags=pygame.BLEND_ADD)
    surf.blit(base, rect)
    return rect

def draw_panel(surf, rect, border_color=None, fill_alpha=200):
    if border_color is None: border_color = C("cyan")
    panel = pygame.Surface((rect.w, rect.h), pygame.SRCALPHA)
    panel.fill((*C("panel"), fill_alpha))
    surf.blit(panel, rect.topleft)
    for i in range(3):
        alpha = 100 - i * 30
        glow = pygame.Surface((rect.w + i*4, rect.h + i*4), pygame.SRCALPHA)
        pygame.draw.rect(glow, (*border_color, alpha),
                         (0, 0, rect.w + i*4, rect.h + i*4), 2, border_radius=8)
        surf.blit(glow, (rect.x - i*2, rect.y - i*2))
    pygame.draw.rect(surf, border_color, rect, 2, border_radius=8)

def draw_grid_background(surf, w, h):

    for y in range(0, h, 40):
        pygame.draw.line(surf, C("grid"), (0, y), (w, y), 1)

class NeonButton:
    def __init__(self, rect, text, action, color_key="cyan"):
        self.rect = rect
        self.text = text
        self.action = action
        self.color_key = color_key
        self.pressed = False
        self.flash = 0
    @property
    def color(self): return C(self.color_key)
    def handle(self, e):
        if e.type == pygame.FINGERDOWN:
            x, y = e.x * SCREEN_W, e.y * SCREEN_H
            if self.rect.collidepoint(x, y):
                self.pressed = True; self.flash = 15; return True
        elif e.type == pygame.FINGERUP: self.pressed = False
        elif e.type == pygame.MOUSEBUTTONDOWN:
            if self.rect.collidepoint(*e.pos):
                self.pressed = True; self.flash = 15; return True
        elif e.type == pygame.MOUSEBUTTONUP: self.pressed = False
        return False
    def draw(self, surf):
        if self.flash > 0: self.flash -= 1
        base = self.color
        if self.pressed: base = tuple(min(255, c+60) for c in base)
        gi = 3 if self.flash > 0 else 1
        for i in range(gi, 0, -1):
            alpha = 40 if self.flash > 0 else 20
            glow = pygame.Surface((self.rect.w+i*6, self.rect.h+i*6), pygame.SRCALPHA)
            pygame.draw.rect(glow, (*base, alpha),
                             (0, 0, self.rect.w+i*6, self.rect.h+i*6), border_radius=12)
            surf.blit(glow, (self.rect.x-i*3, self.rect.y-i*3))
        pygame.draw.rect(surf, C("btn_bg"), self.rect, border_radius=10)
        pygame.draw.rect(surf, base, self.rect, 3, border_radius=10)
        txt = _FONT_MED.render(self.text, True, base)
        surf.blit(txt, txt.get_rect(center=self.rect.center))

        y += 60
        if status_timer > 0:

        y += 40
        pt = _FONT_SMALL.render("Quick Presets (tap to fill):", True, C("yellow"))
        screen.blit(pt, (panel.x+40, y))
        y += 25
        preset_buttons = []
        for i, (u, p) in enumerate(presets):
            col = i % 3
            row = i // 3
            px = panel.x + 40 + col * int(panel.w * 0.28)
            py_ = y + row * 32
            label = f"{u}/{p if p else 'blank'}"
            btn = NeonButton(pygame.Rect(px, py_, int(panel.w * 0.26), 28),

        btn_y = panel.bottom - 55

        bh = 45
        b1 = NeonButton(pygame.Rect(panel.x+40, btn_y, bw, bh),

        b2 = NeonButton(pygame.Rect(panel.centerx-bw//2, btn_y, bw, bh),
                        "SAVE", "save", "cyan")
        b3 = NeonButton(pygame.Rect(panel.right-40-bw, btn_y, bw, bh),
                        "BACK", "back", "yellow")
        buttons = [b1, b2, b3]
        for b in buttons: b.draw(screen)

        if editing != last_editing:
            last_editing = editing
            try:
                if editing == "user":
                    pygame.key.start_text_input()
                    pygame.key.set_text_input_rect(user_rect)
                elif editing == "pass":
                    pygame.key.start_text_input()
                    pygame.key.set_text_input_rect(pass_rect)
                else:
                    pygame.key.stop_text_input()
            except Exception:
                pass

        pygame.display.flip()

        for e in pygame.event.get():
            if e.type == pygame.QUIT:
                try: pygame.key.stop_text_input()
                except Exception: pass
                return
            if e.type == pygame.KEYDOWN:
                if e.key == pygame.K_ESCAPE:
                    try: pygame.key.stop_text_input()
                    except Exception: pass
                    return
                if editing:
                    if e.key == pygame.K_BACKSPACE:
                        if editing == "user": user_input = user_input[:-1]
                        else: pass_input = pass_input[:-1]
                    elif e.key == pygame.K_RETURN:
                        editing = None
                    elif e.key == pygame.K_TAB:
                        editing = "pass" if editing == "user" else "user"
                    elif 32 <= e.key < 127:
                        if editing == "user" and len(user_input) < 30:
                            user_input += chr(e.key)
                        elif editing == "pass" and len(pass_input) < 30:
                            pass_input += chr(e.key)
            elif e.type == pygame.TEXTINPUT and editing:
                for ch in e.text:
                    if 32 <= ord(ch) < 127:
                        if editing == "user" and len(user_input) < 30:
                            user_input += ch
                        elif editing == "pass" and len(pass_input) < 30:
                            pass_input += ch
            elif e.type == pygame.MOUSEBUTTONDOWN:
                clicked_preset = False
                for btn, u, p in preset_buttons:
                    if btn.rect.collidepoint(e.pos):
                        user_input = u; pass_input = p
                        clicked_preset = True; break
                if clicked_preset: continue
                if user_rect.collidepoint(e.pos): editing = "user"
                elif pass_rect.collidepoint(e.pos): editing = "pass"
                else: editing = None
                for b in buttons:
                    if b.handle(e):
                        if b.action == "save":
                            user_data["router_user"] = user_input
                            user_data["router_pass"] = pass_input
                            save_user_data(user_data)
                            status_msg = "Saved OK"
                            status_timer = 120
                        elif b.action == "fetch":
                            user_data["router_user"] = user_input
                            user_data["router_pass"] = pass_input
                            save_user_data(user_data)
                            status_msg = "Fetching... please wait"
                            status_timer = 300
                            pygame.display.flip()
                            devices = fetch_router_devices(
                                scanner.router_ip, user_input, pass_input)
                            if devices:
                                for d in devices:
                                    user_data["router_devices"][d["ip"]] = d["mac"]
                                save_user_data(user_data)
                                status_msg = f"OK - {len(devices)} devices found"
                            else:
                                status_msg = "Failed - Router not supported"
                            status_timer = 240
                        elif b.action == "back":
                            user_data["router_user"] = user_input
                            user_data["router_pass"] = pass_input
                            save_user_data(user_data)
                            try: pygame.key.stop_text_input()
                            except Exception: pass
                            return
            elif e.type == pygame.FINGERDOWN:
                x, y_pos = e.x*SCREEN_W, e.y*SCREEN_H
                clicked_preset = False
                for btn, u, p in preset_buttons:
                    if btn.rect.collidepoint(x, y_pos):
                        user_input = u; pass_input = p
                        clicked_preset = True; break
                if clicked_preset: continue
                if user_rect.collidepoint(x, y_pos): editing = "user"
                elif pass_rect.collidepoint(x, y_pos): editing = "pass"
                else: editing = None
                for b in buttons:
                    if b.rect.collidepoint(x, y_pos):
                        if b.action == "save":
                            user_data["router_user"] = user_input
                            user_data["router_pass"] = pass_input
                            save_user_data(user_data)
                            status_msg = "Saved OK"
                            status_timer = 120
                        elif b.action == "fetch":
                            user_data["router_user"] = user_input
                            user_data["router_pass"] = pass_input
                            save_user_data(user_data)
                            status_msg = "Fetching..."
                            status_timer = 300
                            devices = fetch_router_devices(
                                scanner.router_ip, user_input, pass_input)
                            if devices:
                                for d in devices:
                                    user_data["router_devices"][d["ip"]] = d["mac"]
                                save_user_data(user_data)
                                status_msg = f"OK - {len(devices)} devices"
                            else:
                                status_msg = "Failed - unsupported"
                            status_timer = 240
                        elif b.action == "back":
                            user_data["router_user"] = user_input
                            user_data["router_pass"] = pass_input
                            save_user_data(user_data)
                            try: pygame.key.stop_text_input()
                            except Exception: pass
                            return
        clock.tick(30)

# ============ Device Details ============
def show_device_details(screen, clock, device, user_data, sounds, scanner):
    name_input = device.get("custom_name", "")
    editing = False
    blink = 0
    scroll = 0
    last_editing = False

    while True:
        blink += 1
        screen.fill(C("bg"))
        for x in range(0, SCREEN_W, 40):
            pygame.draw.line(screen, C("grid"), (x, 0), (x, SCREEN_H), 1)
        for y in range(0, SCREEN_H, 40):
            pygame.draw.line(screen, C("grid"), (0, y), (SCREEN_W, y), 1)
        draw_text_neon(screen, "DEVICE DETAILS", _FONT_BIG,
                       (SCREEN_W//2, 30), C("cyan"), center=True)
        panel = pygame.Rect(int(SCREEN_W*0.05), int(SCREEN_H*0.10),
                            int(SCREEN_W*0.90), int(SCREEN_H*0.78))
        draw_panel(screen, panel)
        pad = 20
        inner_y = panel.y + pad
        inner_h = panel.h - pad*2 - 60
        clip = pygame.Rect(panel.x+pad, inner_y, panel.w-pad*2, inner_h)
        old = screen.get_clip()
        screen.set_clip(clip)
        y = inner_y - scroll
        line_h = max(22, int(SCREEN_H*0.034))

        def kv(label, value, col=None):
            nonlocal y
            if y + line_h < inner_y or y > inner_y + inner_h:
                y += line_h; return
            lt = _FONT_SMALL.render(label, True, C("purple"))
            screen.blit(lt, (panel.x+pad, y))
            vt = _FONT_MONO.render(str(value), True, col or C("text"))
            screen.blit(vt, (panel.x+int(panel.w*0.38), y))
            y += line_h

        kv("IP", device["ip"])
        kv("MAC", device["mac"], C("yellow"))
        kv("Vendor", device.get("vendor", "Unknown"))
        kv("Device Type", device.get("type", "Unknown"), C("cyan"))
        kv("OS (TTL)", device.get("os", "Unknown"), C("green"))
        kv("TTL", device.get("ttl", 0))
        kv("Hostname", device.get("name", "Unknown"))
        if device.get("netbios"): kv("NetBIOS", device["netbios"], C("yellow"))
        if device.get("reverse_dns"): kv("Reverse DNS", device["reverse_dns"])
        kv("Ping", f"{device.get('ping', 0)} ms")
        kv("Packet Loss", f"{device.get('loss', 0)} %")
        kv("Uptime Guess", device.get("uptime", "Unknown"))
        tc = C("green") if device.get("trusted") else C("red")
        kv("Trust", "TRUSTED" if device.get("trusted") else "UNTRUSTED", tc)
        ports = device.get("ports", [])
        if ports:
            kv("Open Ports", f"{len(ports)} ports", C("cyan"))
            for p in ports[:15]:
                svc = lookup_service(p)
                dg = p in DANGEROUS_PORTS
                kv(f"  :{p}", svc, C("red") if dg else C("text_dim"))
        else:
            kv("Open Ports", "None detected")
        dangerous = device.get("dangerous_ports", [])
        if dangerous: kv("DANGER", f"{len(dangerous)} risky", C("red"))
        http_info = device.get("http_info", {})
        if http_info:
            for port, info in http_info.items():
                if info.get("server"): kv(f"HTTP:{port}", info["server"], C("green"))
        banners = device.get("banners", {})
        if banners:
            for p, b in list(banners.items())[:4]:
                kv(f"Banner :{p}", b[:40], C("purple"))
        ip = device["ip"]
        if ip in scanner.ssdp_devices:
            info = scanner.ssdp_devices[ip]
            kv("SSDP Server", info.get("server", "")[:40], C("cyan"))
        y += 5
        nt = _FONT_SMALL.render("Custom Name:", True, C("purple"))
        screen.blit(nt, (panel.x+pad, y))
        input_rect = pygame.Rect(panel.x+int(panel.w*0.38), y-4,
                                  int(panel.w*0.55), 30)
        pygame.draw.rect(screen, C("btn_bg"), input_rect, border_radius=6)
        pygame.draw.rect(screen, C("yellow") if editing else C("cyan"),
                          input_rect, 2, border_radius=6)
        cursor = "|" if editing and blink % 30 < 15 else ""
        t = _FONT_MONO.render(name_input + cursor, True, C("text"))
        screen.blit(t, (input_rect.x+8, input_rect.y+5))
        screen.set_clip(old)

        if scanner.deep_scanning:
            lb = pygame.Surface((int(SCREEN_W*0.5), 36), pygame.SRCALPHA)
            lb.fill((*C("yellow"), 220))
            screen.blit(lb, (SCREEN_W//2 - lb.get_width()//2, panel.bottom - 100))
            txt = _FONT_MED.render("DEEP SCANNING... please wait", True, C("bg"))
            screen.blit(txt, txt.get_rect(center=(SCREEN_W//2, panel.bottom - 82)))

        btn_y = panel.bottom - 50
        bw = int(panel.w*0.20)
        bh = 40
        gap = int(panel.w*0.02)
        b1 = NeonButton(pygame.Rect(panel.x+pad, btn_y, bw, bh), "EDIT NAME", "edit", "yellow")
        b2 = NeonButton(pygame.Rect(panel.x+pad+bw+gap, btn_y, bw, bh),
                        "TRUST" if not device.get("trusted") else "UNTRUST",
                        "trust", "green" if not device.get("trusted") else "red")
        b3 = NeonButton(pygame.Rect(panel.x+pad+(bw+gap)*2, btn_y, bw, bh),
                        "DEEP SCAN", "deep", "purple")
        b4 = NeonButton(pygame.Rect(panel.x+pad+(bw+gap)*3, btn_y, bw, bh),
                        "BACK", "back", "cyan")
        buttons = [b1, b2, b3, b4]
        for b in buttons: b.draw(screen)

        if editing != last_editing:
            last_editing = editing
            try:
                if editing:
                    pygame.key.start_text_input()
                    pygame.key.set_text_input_rect(input_rect)
                else:
                    pygame.key.stop_text_input()
            except Exception:
                pass

        pygame.display.flip()

        for e in pygame.event.get():
            if e.type == pygame.QUIT:
                try: pygame.key.stop_text_input()
                except Exception: pass
                return False
            if e.type == pygame.KEYDOWN:
                if e.key == pygame.K_ESCAPE:
                    try: pygame.key.stop_text_input()
                    except Exception: pass
                    return True
                if editing:
                    if e.key == pygame.K_BACKSPACE:
                        name_input = name_input[:-1]
                    elif e.key == pygame.K_RETURN:
                        editing = False
                        mac = device["mac"]
                        kd = user_data.setdefault("known_devices", {})
                        kd.setdefault(mac, {})["name"] = name_input
                        device["custom_name"] = name_input
                        save_user_data(user_data)
                    elif 32 <= e.key < 127 and len(name_input) < 24:
                        name_input += chr(e.key)
            elif e.type == pygame.TEXTINPUT and editing:
                for ch in e.text:
                    if 32 <= ord(ch) < 127 and len(name_input) < 24:
                        name_input += ch
            elif e.type == pygame.MOUSEWHEEL:
                scroll -= e.y * 20
                scroll = max(0, scroll)
            elif e.type == pygame.MOUSEBUTTONDOWN:
                if input_rect.collidepoint(e.pos): editing = True
                else: editing = False
                for b in buttons:
                    if b.handle(e):
                        if b.action == "edit": editing = True
                        elif b.action == "trust":
                            mac = device["mac"]
                            kd = user_data.setdefault("known_devices", {})
                            kd.setdefault(mac, {})
                            nt2 = not device.get("trusted")
                            kd[mac]["trusted"] = nt2
                            if name_input: kd[mac]["name"] = name_input
                            device["trusted"] = nt2
                            device["custom_name"] = name_input or device.get("name", "")
                            save_user_data(user_data)
                            if nt2: sounds.play("success")
                        elif b.action == "deep":
                            threading.Thread(target=scanner.deep_scan,
                                              args=(device,), daemon=True).start()
                        elif b.action == "back":
                            if name_input:
                                mac = device["mac"]
                                kd = user_data.setdefault("known_devices", {})
                                kd.setdefault(mac, {})["name"] = name_input
                                device["custom_name"] = name_input
                                save_user_data(user_data)
                            try: pygame.key.stop_text_input()
                            except Exception: pass
                            return True
            elif e.type == pygame.FINGERDOWN:
                x, yp = e.x*SCREEN_W, e.y*SCREEN_H
                if input_rect.collidepoint(x, yp): editing = True
                else: editing = False
                for b in buttons:
                    if b.rect.collidepoint(x, yp):
                        if b.action == "edit": editing = True
                        elif b.action == "trust":
                            mac = device["mac"]
                            kd = user_data.setdefault("known_devices", {})
                            kd.setdefault(mac, {})
                            nt2 = not device.get("trusted")
                            kd[mac]["trusted"] = nt2
                            if name_input: kd[mac]["name"] = name_input
                            device["trusted"] = nt2
                            device["custom_name"] = name_input or device.get("name", "")
                            save_user_data(user_data)
                            if nt2: sounds.play("success")
                        elif b.action == "deep":
                            threading.Thread(target=scanner.deep_scan,
                                              args=(device,), daemon=True).start()
                        elif b.action == "back":
                            if name_input:
                                mac = device["mac"]
                                kd = user_data.setdefault("known_devices", {})
                                kd.setdefault(mac, {})["name"] = name_input
                                device["custom_name"] = name_input
                                save_user_data(user_data)
                            try: pygame.key.stop_text_input()
                            except Exception: pass
                            return True
        clock.tick(30)

# ============ History ============
def show_history(screen, clock):
    history = load_history()
    scroll = 0
    while True:
        screen.fill(C("bg"))
        for x in range(0, SCREEN_W, 40):
            pygame.draw.line(screen, C("grid"), (x, 0), (x, SCREEN_H), 1)
        for y in range(0, SCREEN_H, 40):
            pygame.draw.line(screen, C("grid"), (0, y), (SCREEN_W, y), 1)
        draw_text_neon(screen, "HISTORY LOG", _FONT_BIG,
                       (SCREEN_W//2, 40), C("cyan"), center=True)
        panel = pygame.Rect(int(SCREEN_W*0.05), int(SCREEN_H*0.13),
                            int(SCREEN_W*0.90), int(SCREEN_H*0.72))
        draw_panel(screen, panel)
        pad = 15
        inner_y = panel.y + pad
        inner_h = panel.h - pad*2 - 50
        clip = pygame.Rect(panel.x+pad, inner_y, panel.w-pad*2, inner_h)
        old = screen.get_clip()
        screen.set_clip(clip)
        row_h = max(26, int(SCREEN_H*0.04))
        items = list(reversed(history))
        for i, item in enumerate(items):
            y = inner_y + i*row_h - scroll
            if y+row_h < inner_y or y > inner_y+inner_h: continue
            ev = item.get("event", "")
            if ev == "new_device": col = C("red")
            elif ev == "dangerous_ports": col = C("yellow")
            else: col = C("green")
            txt = f"[{item.get('time','')}] {ev.upper()}: {item.get('ip','')} / {item.get('name','')}"
            t = _FONT_MONO.render(txt, True, col)
            screen.blit(t, (inner_y, y))
        screen.set_clip(old)
        if not history:
            t = _FONT_MED.render("No history", True, C("text_dim"))
            screen.blit(t, t.get_rect(center=panel.center))
        back = NeonButton(pygame.Rect(panel.centerx-100, panel.bottom-55, 200, 42),
                          "BACK", "back", "cyan")
        back.draw(screen)
        pygame.display.flip()
        for e in pygame.event.get():
            if e.type == pygame.QUIT: return
            if e.type == pygame.KEYDOWN and e.key == pygame.K_ESCAPE: return
            if e.type == pygame.MOUSEWHEEL:
                scroll -= e.y*30
                scroll = max(0, min(scroll, max(0, len(items)*row_h - inner_h)))
            elif e.type == pygame.MOUSEBUTTONDOWN:
                if back.handle(e): return
            elif e.type == pygame.FINGERDOWN:
                x, y = e.x*SCREEN_W, e.y*SCREEN_H
                if back.rect.collidepoint(x, y): return
        clock.tick(30)

# ============ Stats ============
def show_stats(screen, clock, scanner, user_data):
    while True:
        screen.fill(C("bg"))
        for x in range(0, SCREEN_W, 40):
            pygame.draw.line(screen, C("grid"), (x, 0), (x, SCREEN_H), 1)
        for y in range(0, SCREEN_H, 40):
            pygame.draw.line(screen, C("grid"), (0, y), (SCREEN_W, y), 1)
        draw_text_neon(screen, "STATISTICS", _FONT_BIG,
                       (SCREEN_W//2, 40), C("cyan"), center=True)
        panel = pygame.Rect(int(SCREEN_W*0.10), int(SCREEN_H*0.15),
                            int(SCREEN_W*0.80), int(SCREEN_H*0.68))
        draw_panel(screen, panel)
        devices = scanner.devices
        total = len(devices)
        trusted = sum(1 for d in devices if d.get("trusted"))
        unknown = total - trusted
        routers = sum(1 for d in devices if d.get("kind") == "router")
        dangerous = sum(1 for d in devices if d.get("dangerous_ports"))
        history = load_history()
        total_new = sum(1 for h in history if h.get("event") == "new_device")
        stats = [
            ("Total Devices", str(total), "cyan"),
            ("Trusted", str(trusted), "green"),
            ("Unknown", str(unknown), "red"),
            ("Routers", str(routers), "yellow"),
            ("Risky Devices", str(dangerous), "yellow"),
            ("New Devices Ever", str(total_new), "purple"),
            ("History Events", str(len(history)), "blue"),
            ("Router MACs", str(len(user_data.get("router_devices", {}))), "cyan"),
        ]
        pad = 40
        y = panel.y + pad
        lh = max(30, int(SCREEN_H*0.048))
        for label, value, col in stats:
            lt = _FONT_MED.render(label, True, C("text"))
            screen.blit(lt, (panel.x+pad, y))
            vt = _FONT_BIG.render(value, True, C(col))
            screen.blit(vt, (panel.right-pad-vt.get_width(), y-5))
            y += lh
        back = NeonButton(pygame.Rect(panel.centerx-100, panel.bottom-55, 200, 42),
                          "BACK", "back", "cyan")
        back.draw(screen)
        pygame.display.flip()
        for e in pygame.event.get():
            if e.type == pygame.QUIT: return
            if e.type == pygame.KEYDOWN and e.key == pygame.K_ESCAPE: return
            elif e.type == pygame.MOUSEBUTTONDOWN:
                if back.handle(e): return
            elif e.type == pygame.FINGERDOWN:
                x, y = e.x*SCREEN_W, e.y*SCREEN_H
                if back.rect.collidepoint(x, y): return
        clock.tick(30)

# ============ Network Graph ============
def show_network_graph(screen, clock, scanner):
    rot = 0
    while True:
        rot += 0.01
        screen.fill(C("bg"))
        for x in range(0, SCREEN_W, 40):
            pygame.draw.line(screen, C("grid"), (x, 0), (x, SCREEN_H), 1)
        for y in range(0, SCREEN_H, 40):
            pygame.draw.line(screen, C("grid"), (0, y), (SCREEN_W, y), 1)
        draw_text_neon(screen, "NETWORK MAP", _FONT_BIG,
                       (SCREEN_W//2, 40), C("cyan"), center=True)
        cx, cy = SCREEN_W//2, SCREEN_H//2 + 20
        rc = 40
        ring = min(SCREEN_W, SCREEN_H)//3
        pygame.draw.circle(screen, C("yellow"), (cx, cy), rc, 3)
        t = _FONT_SMALL.render("ROUTER", True, C("yellow"))
        screen.blit(t, t.get_rect(center=(cx, cy)))
        devices = [d for d in scanner.devices if d.get("kind") != "router"]
        n = len(devices)
        if n > 0:
            for i, dev in enumerate(devices):
                angle = rot + i * (2*math.pi/n)
                dx = cx + math.cos(angle)*ring
                dy = cy + math.sin(angle)*ring
                if dev.get("kind") == "me": col = C("green")
                elif dev.get("trusted"): col = C("blue")
                elif dev.get("dangerous_ports"): col = C("red")
                else: col = C("purple")
                pygame.draw.line(screen, col, (cx, cy), (dx, dy), 2)
                pygame.draw.circle(screen, col, (int(dx), int(dy)), 18, 2)
                pygame.draw.circle(screen, col, (int(dx), int(dy)), 8)
                label = dev.get("custom_name", "?")
                if len(label) > 12: label = label[:11] + "…"
                t = _FONT_TINY.render(label, True, col)
                screen.blit(t, t.get_rect(center=(dx, dy+30)))
        if not devices:

# ============ Speed Test ============
def show_speed_test(screen, clock, scanner):
    result = None
    testing = False
    def run():
        nonlocal result, testing
        testing = True
        try:
            start = time.time()
            s = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
            s.settimeout(10)
            s.connect(("1.1.1.1", 80))
            s.sendall(b"GET / HTTP/1.0\r\nHost: 1.1.1.1\r\n\r\n")
            total = 0
            while time.time() - start < 5:
                data = s.recv(65536)
                if not data: break
                total += len(data)
                if total > 3_000_000: break
            el = time.time() - start
            s.close()
            dl = round((total * 8) / (el * 1_000_000), 2)
            _, ping_ms, _ = scanner.ping_detailed("1.1.1.1")
            result = {"download": dl, "ping": ping_ms}
        except Exception as ex:
            result = {"download": 0, "ping": 0, "error": str(ex)[:40]}
        testing = False
    threading.Thread(target=run, daemon=True).start()
    while True:
        screen.fill(C("bg"))
        for x in range(0, SCREEN_W, 40):
            pygame.draw.line(screen, C("grid"), (x, 0), (x, SCREEN_H), 1)
        for y in range(0, SCREEN_H, 40):
            pygame.draw.line(screen, C("grid"), (0, y), (SCREEN_W, y), 1)
        draw_text_neon(screen, "SPEED TEST", _FONT_BIG,
                       (SCREEN_W//2, 40), C("cyan"), center=True)
        panel = pygame.Rect(int(SCREEN_W*0.15), int(SCREEN_H*0.20),
                            int(SCREEN_W*0.70), int(SCREEN_H*0.55))
        draw_panel(screen, panel)
        if testing:
            t = _FONT_BIG.render("Testing...", True, C("yellow"))
            screen.blit(t, t.get_rect(center=panel.center))
        elif result:
            y = panel.y + 40
            items = [
                ("Download", f"{result.get('download', 0)} Mbps", "green"),
                ("Ping", f"{result.get('ping', 0)} ms", "cyan"),
            ]
            for label, value, col in items:
                lt = _FONT_MED.render(label, True, C("text"))
                screen.blit(lt, (panel.x+40, y))
                vt = _FONT_BIG.render(value, True, C(col))
                screen.blit(vt, (panel.right-300, y-8))
                y += 60
            if result.get("error"):
                t = _FONT_SMALL.render(result["error"], True, C("red"))
                screen.blit(t, (panel.x+40, y))
        else:
            t = _FONT_MED.render("Starting...", True, C("text_dim"))
            screen.blit(t, t.get_rect(center=panel.center))
        back = NeonButton(pygame.Rect(panel.centerx-100, panel.bottom-60, 200, 45),
                          "BACK", "back", "cyan")
        back.draw(screen)
        pygame.display.flip()
        for e in pygame.event.get():
            if e.type == pygame.QUIT: return
            if e.type == pygame.KEYDOWN and e.key == pygame.K_ESCAPE: return
            elif e.type == pygame.MOUSEBUTTONDOWN:
                if back.handle(e): return
            elif e.type == pygame.FINGERDOWN:
                x, y = e.x*SCREEN_W, e.y*SCREEN_H
                if back.rect.collidepoint(x, y): return
        clock.tick(30)
