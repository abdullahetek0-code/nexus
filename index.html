<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Nexus Store | Ultimate</title>
  
  <meta name="theme-color" content="#05070a">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --bg-dark: #05070a; --surface: rgba(20, 25, 35, 0.6); --neon-cyan: #00f0ff; --neon-purple: #b000ff;
      --neon-pink: #ff007f; --neon-green: #39ff14; --neon-red: #ff2e63; --text-main: #ffffff; --text-muted: #94a3b8;
      --glass-border: rgba(255, 255, 255, 0.1); --glass-glow: inset 0 0 20px rgba(0, 240, 255, 0.05), 0 10px 30px rgba(0, 0, 0, 0.7);
      --base-font-size: 16px;
    }
    [data-theme="light"] {
      --bg-dark: #f4f6f9; --surface: rgba(255, 255, 255, 0.85); --neon-cyan: #0077ff; --neon-purple: #7b2cbf;
      --neon-pink: #ff007f; --neon-green: #10b981; --neon-red: #ef4444; --text-main: #1e293b; --text-muted: #64748b;
      --glass-border: rgba(0, 0, 0, 0.08); --glass-glow: inset 0 0 20px rgba(0, 119, 255, 0.05), 0 10px 30px rgba(0, 0, 0, 0.1);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { font-family: 'Cairo', sans-serif; font-size: var(--base-font-size); background-color: var(--bg-dark); color: var(--text-main); overflow-x: hidden; padding-bottom: 100px; background-image: radial-gradient(circle at 10% 20%, rgba(176, 0, 255, 0.12) 0%, transparent 40%), radial-gradient(circle at 90% 80%, rgba(0, 240, 255, 0.12) 0%, transparent 40%); background-attachment: fixed; transition: background-color 0.4s, color 0.4s; }
    #networkCanvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; }
    
    /* العلامة المائية */
    .watermark { position: fixed; bottom: 20px; right: 20px; font-size: 2rem; color: var(--neon-cyan); opacity: 0.08; font-weight: 900; pointer-events: none; z-index: 0; user-select: none; }

    .container { max-width: 1200px; margin: 0 auto; padding: 0 15px; }
    header { display: flex; justify-content: space-between; align-items: center; padding: 12px 5%; position: fixed; width: 100%; top: 0; z-index: 100; background: var(--surface); backdrop-filter: blur(20px); border-bottom: 1px solid var(--glass-border); }
    .logo { font-size: 1.3rem; font-weight: 900; background: linear-gradient(90deg, var(--neon-cyan), var(--neon-purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .header-actions { display: flex; align-items: center; gap: 10px; }
    .owner-name { font-size: 0.8rem; font-weight: 700; color: var(--neon-cyan); }

    .hero-section { padding: 75px 0 10px; }
    .hero-card { background: var(--surface); border: 1px solid var(--glass-border); border-radius: 20px; padding: 15px 20px; display: flex; align-items: center; gap: 15px; box-shadow: var(--glass-glow); }
    .hero-img { width: 100px; height: 140px; border-radius: 12px; object-fit: cover; }
    .hero-title { font-size: 1.2rem; font-weight: 800; margin-bottom: 5px; }
    .hero-btn { background: linear-gradient(90deg, var(--neon-cyan), var(--neon-purple)); color: #fff; border: none; padding: 8px 18px; border-radius: 10px; font-family: inherit; font-weight: bold; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; }

    .section-title { font-size: 1.1rem; font-weight: 800; margin: 25px 0 15px; display: flex; align-items: center; gap: 8px; }
    .section-title::before { content: ''; width: 4px; height: 18px; background: var(--neon-cyan); border-radius: 2px; }
    .horizontal-scroll { display: flex; overflow-x: auto; gap: 15px; padding-bottom: 15px; scrollbar-width: none; }
    .horizontal-scroll::-webkit-scrollbar { display: none; }
    .book-card { min-width: 150px; max-width: 150px; background: var(--surface); border: 1px solid var(--glass-border); border-radius: 16px; padding: 10px; position: relative; cursor: pointer; backdrop-filter: blur(10px); transition: 0.3s; }
    .book-card:hover { transform: translateY(-5px); border-color: var(--neon-cyan); box-shadow: 0 10px 20px rgba(0,0,0,0.3); }
    .book-img-wrap { width: 100%; height: 190px; border-radius: 10px; overflow: hidden; margin-bottom: 10px; position: relative; }
    .book-img-wrap img { width: 100%; height: 100%; object-fit: cover; transition: 0.5s; }
    .book-card:hover .book-img-wrap img { transform: scale(1.1); }
    .book-title { font-size: 0.85rem; font-weight: 700; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .book-type { font-size: 0.7rem; color: var(--text-muted); }
    
    .fav-icon { position: absolute; top: 8px; right: 8px; background: rgba(0,0,0,0.6); width: 30px; height: 30px; border-radius: 50%; display: flex; justify-content: center; align-items: center; color: #fff; font-size: 0.8rem; border: 1px solid rgba(255,255,255,0.2); z-index: 2; transition: 0.3s; }
    .fav-icon.active { color: var(--neon-pink); border-color: var(--neon-pink); background: rgba(255,0,127,0.2); box-shadow: 0 0 10px var(--neon-pink); }
    .premium-badge-tag { position: absolute; top: 8px; left: 8px; z-index: 3; background: linear-gradient(135deg, #ff007f, #b000ff); color: #fff; font-size: 0.55rem; font-weight: 900; padding: 3px 7px; border-radius: 8px; box-shadow: 0 0 12px rgba(255,0,127,0.7); }

    .categories { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 10px; scrollbar-width: none; }
    .cat-btn { background: var(--surface); border: 1px solid var(--glass-border); color: var(--text-muted); padding: 6px 16px; border-radius: 20px; font-family: inherit; font-size: 0.8rem; cursor: pointer; white-space: nowrap; transition: 0.3s; }
    .cat-btn.active { background: var(--neon-cyan); color: #000; border-color: var(--neon-cyan); box-shadow: 0 0 15px rgba(0,240,255,0.3); }

    .bottom-nav { position: fixed; bottom: 15px; left: 50%; transform: translateX(-50%); width: 94%; max-width: 650px; height: 65px; background: rgba(20, 25, 35, 0.4); backdrop-filter: blur(40px); border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 35px; display: flex; justify-content: space-around; align-items: center; z-index: 1000; }
    .nav-item { display: flex; flex-direction: column; align-items: center; color: var(--text-muted); font-size: 0.65rem; cursor: pointer; transition: 0.3s; }
    .nav-item i { font-size: 1.2rem; }
    .nav-item.active { color: var(--neon-cyan); text-shadow: 0 0 10px rgba(0,240,255,0.5); }

    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(10px); z-index: 2000; display: flex; justify-content: center; align-items: flex-end; opacity: 0; visibility: hidden; transition: 0.3s; }
    .modal-overlay.active { opacity: 1; visibility: visible; }
    .modal-content { width: 100%; max-width: 600px; background: var(--bg-dark); border-radius: 24px 24px 0 0; border: 1px solid var(--glass-border); padding: 25px 20px; transform: translateY(100%); transition: 0.4s; max-height: 85vh; overflow-y: auto; position: relative; }
    .modal-overlay.active .modal-content { transform: translateY(0); }
    .close-modal { position: absolute; top: 15px; left: 15px; background: var(--surface); border: none; color: #fff; width: 32px; height: 32px; border-radius: 50%; cursor: pointer; }
    .action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
    .action-btn { padding: 12px; border-radius: 12px; font-weight: bold; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 8px; border: none; font-family: inherit;}
    .btn-read { background: var(--surface); color: #fff; border: 1px solid var(--glass-border);}
    .btn-download { background: linear-gradient(90deg, var(--neon-cyan), var(--neon-purple)); color: #fff; }
    
    .premium-modal-content { background: linear-gradient(160deg, #1a0010, #05070a) !important; border: 2px solid var(--neon-pink) !important; }
    .premium-crown { font-size: 4rem; text-align: center; color: #FFD700; }
    .premium-title { text-align: center; font-size: 1.6rem; font-weight: 900; margin: 15px 0; color: #fff; }
    .premium-soon { text-align: center; color: var(--neon-cyan); font-size: 1rem; font-weight: 800; margin-bottom: 20px; }
    .device-id-box { background: rgba(0,0,0,0.6); border: 1px dashed var(--neon-cyan); padding: 10px; border-radius: 10px; text-align: center; font-family: monospace; color: var(--neon-cyan); margin-bottom: 15px; }
    .lock-input { width: 100%; padding: 12px; border-radius: 10px; background: rgba(0,0,0,0.5); border: 1px solid var(--neon-pink); color: #fff; text-align: center; margin-bottom: 10px; font-family: inherit;}
    
    .info-card { background: var(--surface); border: 1px solid var(--glass-border); border-radius: 20px; padding: 30px; text-align: center; }
    .settings-row { display: flex; justify-content: space-between; align-items: center; padding: 15px 0; border-bottom: 1px solid var(--glass-border); text-align: right; }
    .settings-row:last-child { border-bottom: none; }
    .theme-btn { background: var(--surface); color: #fff; border: 1px solid var(--glass-border); padding: 10px 20px; border-radius: 10px; cursor: pointer; font-family: inherit; }
    .settings-btn { padding: 8px 12px; font-size: 0.85rem; }
    
    .site-footer { text-align: center; padding: 25px 0; color: var(--text-muted); font-size: 0.85rem; border-top: 1px solid var(--glass-border); margin-top: 30px; }
    
    .admin-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 9999; display: none; justify-content: center; align-items: center; }
    .admin-box { background: #111; padding: 30px; border-radius: 20px; border: 1px solid var(--neon-cyan); width: 90%; max-width: 400px; text-align: center; }
    .admin-input { width: 100%; padding: 12px; margin-bottom: 15px; background: #000; border: 1px solid #333; color: #fff; border-radius: 10px; text-align: center; font-family: inherit;}
    
    .pdf-modal .modal-content { height: 90vh; padding: 0; display: flex; flex-direction: column; }
    .pdf-header { padding: 15px; display: flex; justify-content: space-between; background: var(--surface); border-bottom: 1px solid var(--glass-border); }
    .pdf-frame { flex: 1; width: 100%; border: none; background: #333; }

    /* شاشة تسجيل الدخول */
    #loginOverlay {
      position: fixed; inset: 0; z-index: 99999; background-color: #0c0e12;
      font-family: 'Plus Jakarta Sans', sans-serif; color: #f0f3f8;
      overflow-y: auto; overflow-x: hidden; display: none;
      direction: ltr;
    }
    #loginOverlay.active { display: flex; flex-direction: column; min-height: 100%; }
    #loginOverlay[data-on="true"] { background-color: #161920; }
    
    .ambient-glow { position: fixed; inset: 0; background: radial-gradient(circle at 38% 38%, rgba(255, 185, 75, 0.22), transparent 65%); opacity: 0; pointer-events: none; z-index: 1; transition: opacity 0.8s; }
    #loginOverlay[data-on="true"] .ambient-glow { opacity: 0.85; }
    #dustCanvas { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 2; }
    
    .scene-container { flex: 1 0 auto; display: flex; align-items: center; justify-content: center; padding: 2rem; position: relative; z-index: 10; max-width: 1160px; margin: 0 auto; gap: 2rem; width: 100%; min-height: 100vh; }
    .lamp-stage { flex: 1 1 420px; display: flex; justify-content: center; align-items: center; position: relative; }
    .lamp-wrapper { position: relative; width: 400px; height: 520px; display: flex; justify-content: center; align-items: center; }
    .lamp-svg { width: 100%; height: 100%; overflow: visible; filter: drop-shadow(0 15px 35px rgba(0, 0, 0, 0.6)); transition: filter 500ms ease; transform-origin: 54% 44%; }
    
    .svg-light-beam { opacity: 0; visibility: hidden; mix-blend-mode: screen; pointer-events: none; transition: opacity 0.4s, visibility 0.4s; }
    #loginOverlay[data-on="true"] .svg-light-beam { opacity: 1; visibility: visible; animation: beam-bloom 1.4s ease-out both; }
    @keyframes beam-bloom { from { opacity: 0.15; } to { opacity: 1; } }
    
    .shade-reflector-off { opacity: 1; }
    .shade-reflector-on { opacity: 0; transition: opacity 0.35s ease; }
    #loginOverlay[data-on="true"] .shade-reflector-on { opacity: 1; }
    
    .bulb-glow-core { opacity: 0; transition: opacity 0.3s ease; }
    #loginOverlay[data-on="true"] .bulb-glow-core { opacity: 0.95; animation: bulb-flicker-in 650ms ease-out both; }
    @keyframes bulb-flicker-in { 0% { opacity: 0; } 22% { opacity: 0.55; } 34% { opacity: 0.28; } 48% { opacity: 0.9; } 62% { opacity: 0.72; } 100% { opacity: 0.95; } }
    .bulb-filament { stroke: #555; transition: stroke 0.3s ease, filter 0.3s ease; }
    #loginOverlay[data-on="true"] .bulb-filament { stroke: #fff; filter: drop-shadow(0 0 6px #ffab3d); }

    .elastic-cord-path { transition: stroke 0.3s ease; }
    #loginOverlay[data-on="true"] .elastic-cord-path { stroke: #ffe194; filter: drop-shadow(0 0 4px #ffab3d); }
    .cord-bead-group { cursor: grab; touch-action: none; }
    .cord-tooltip { position: absolute; top: 360px; left: 175px; background: rgba(16, 19, 25, 0.88); border: 1px solid rgba(255, 255, 255, 0.14); padding: 6px 14px; border-radius: 20px; font-size: 0.76rem; font-weight: 600; color: #fff; pointer-events: none; animation: floatTooltip 2.2s infinite ease-in-out; transition: opacity 0.4s ease; white-space: nowrap; }
    #loginOverlay[data-on="true"] .cord-tooltip { opacity: 0; }
    @keyframes floatTooltip { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }

    .form-stage { flex: 1 1 420px; display: flex; justify-content: center; align-items: center; position: relative; }
    .login-card { display: block; opacity: 0; visibility: hidden; pointer-events: none; width: 100%; max-width: 410px; background: rgba(18, 22, 28, 0.72); backdrop-filter: blur(28px); border: 1px solid rgba(255, 255, 255, 0.09); border-radius: 30px; padding: 2.5rem 2.2rem; box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5); position: relative; overflow: hidden; transform: translateY(24px) scale(0.96); z-index: 10; transition: 0.5s ease; }
    #loginOverlay[data-on="true"] .login-card { opacity: 1; visibility: visible; pointer-events: auto; transform: translateY(0) scale(1); box-shadow: -20px 0 60px -15px rgba(255, 185, 75, 0.22), 0 30px 65px rgba(0, 0, 0, 0.55); }

    .card-header { margin-bottom: 1.6rem; text-align: left; }
    .card-title { font-size: 1.8rem; font-weight: 800; color: #fff; margin-bottom: 0.35rem; }
    .card-subtitle { font-size: 0.88rem; color: #8b95a5; }

    .auth-tabs { position: relative; display: flex; background: rgba(0, 0, 0, 0.28); padding: 4px; border-radius: 16px; border: 1px solid rgba(255, 255, 255, 0.06); margin-bottom: 1.6rem; }
    .auth-tab { flex: 1; background: transparent; border: none; padding: 9px 0; color: #8b95a5; font-family: inherit; font-size: 0.85rem; font-weight: 600; cursor: pointer; z-index: 2; transition: color 0.3s ease; text-align: center; }
    .auth-tab.active { color: #fff; }
    .tab-slider { position: absolute; top: 4px; bottom: 4px; left: 4px; width: calc(50% - 4px); background: rgba(255, 255, 255, 0.12); border-radius: 12px; transition: transform 0.35s; z-index: 1; }
    .auth-tabs[data-active="register"] .tab-slider { transform: translateX(100%); }

    .form-group { margin-bottom: 1.25rem; text-align: left; }
    .form-group label { display: block; font-size: 0.8rem; font-weight: 600; color: #8b95a5; margin-bottom: 0.45rem; }
    .input-wrapper { position: relative; display: flex; align-items: center; background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 15px; transition: all 0.3s; }
    .input-wrapper:focus-within { border-color: #ffab3d; background: rgba(255, 255, 255, 0.08); box-shadow: 0 0 0 3px rgba(255, 171, 61, 0.18); }
    .field-icon { position: absolute; left: 15px; width: 18px; height: 18px; color: #545c6b; }
    .input-wrapper input { width: 100%; padding: 13px 42px 13px 44px; background: transparent; border: none; outline: none; color: #fff; font-size: 0.92rem; font-family: inherit; direction: ltr; }
    .hidden { display: none !important; }

    .submit-btn { position: relative; width: 100%; padding: 14px; border-radius: 15px; border: none; background: linear-gradient(135deg, #ffab3d 0%, #d48b28 100%); color: #0b0d10; font-family: inherit; font-size: 0.95rem; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.3s; }
    .submit-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4); }
    .btn-spinner { width: 20px; height: 20px; border: 2.5px solid rgba(0, 0, 0, 0.25); border-top-color: #000; border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .btn-success-icon { width: 22px; height: 22px; color: #0b0d10; }

    /* إصلاح الشاشة المقطوعة على الهاتف */
    @media (max-width: 960px) {
      #loginOverlay { overflow-y: auto !important; }
      .scene-container { flex-direction: column !important; padding: 10px !important; gap: 0 !important; min-height: auto !important; align-items: stretch !important; }
      .lamp-stage { flex: 0 0 auto !important; height: 250px !important; margin-top: -20px !important; }
      .lamp-wrapper { width: 280px !important; height: 340px !important; margin: 0 auto !important; transform-origin: top center !important; transform: scale(0.65) !important; }
      #loginOverlay[data-on="true"] .lamp-wrapper { transform: scale(0.45) !important; margin-top: -30px !important; margin-bottom: -50px !important; }
      .form-stage { width: 100% !important; padding: 0 5px 30px 5px !important; }
      .login-card { max-width: 100% !important; padding: 1.2rem 1rem !important; }
      .card-title { font-size: 1.3rem !important; }
      .card-header { margin-bottom: 0.8rem !important; }
      .auth-tabs { margin-bottom: 0.8rem !important; }
      .form-group { margin-bottom: 0.7rem !important; }
      .input-wrapper input { padding: 10px 35px 10px 38px !important; font-size: 0.85rem !important; }
      .submit-btn { padding: 10px !important; font-size: 0.85rem !important; }
    }
  </style>
</head>
<body>

  <!-- العلامة المائية -->
  <div class="watermark">𝒂𝒃𝒅𝒖𝒍𝒍𝒂𝒉𝒆𝒕𝒆𝒌</div>

  <!-- المتجر الأساسي -->
  <div id="mainStore">
    <canvas id="networkCanvas"></canvas>

    <header>
      <div class="logo">Nexus Store</div>
      <div class="header-actions">
        <span class="owner-name" id="headerUserName">زائر</span>
      </div>
    </header>

    <div class="container">
      <section class="hero-section" id="heroSection">
        <div class="hero-card" id="heroCard"></div>
      </section>
      
      <div class="categories" id="categoriesContainer">
        <button class="cat-btn active" onclick="filterCategory('all', this)">الكل</button>
        <button class="cat-btn" onclick="filterCategory('philosophy', this)">فلسفة</button>
        <button class="cat-btn" onclick="filterCategory('arabic', this)">عربي</button>
        <button class="cat-btn" onclick="filterCategory('science', this)">علوم وفيزياء</button>
        <button class="cat-btn" onclick="filterCategory('languages', this)">لغات</button>
        <button class="cat-btn" onclick="filterCategory('religion', this)">ديانة</button>
      </div>
      
      <div id="dynamicSections"></div>
      
      <footer class="site-footer">
        جميع الحقوق محفوظة بواسطة 𝒂𝒃𝒅𝒖𝒍𝒍𝒂𝒉𝒆𝒕𝒆𝒌
      </footer>
    </div>

    <nav class="bottom-nav">
      <div class="nav-item active" onclick="switchTab('home', this)"><i class="fas fa-home"></i><span>الرئيسية</span></div>
      <div class="nav-item" onclick="switchTab('favorites', this)"><i class="fas fa-heart"></i><span>المفضلة</span></div>
      <div class="nav-item" onclick="switchTab('python', this)"><i class="fab fa-python"></i><span>Python</span></div>
      <div class="nav-item" onclick="switchTab('settings', this)"><i class="fas fa-cog"></i><span>الإعدادات</span></div>
      <div class="nav-item" onclick="switchTab('contact', this)"><i class="fas fa-envelope"></i><span>اتصل بنا</span></div>
    </nav>

    <div class="modal-overlay" id="detailsModal">
      <div class="modal-content" id="detailsModalContent"></div>
    </div>

    <div class="modal-overlay pdf-modal" id="pdfModal">
      <div class="modal-content">
        <div class="pdf-header">
          <span id="pdfTitle" style="font-weight: bold; color: var(--neon-cyan);">عنوان الملف</span>
          <button class="close-modal" style="position: static;" onclick="document.getElementById('pdfModal').classList.remove('active')"><i class="fas fa-times"></i></button>
        </div>
        <iframe id="pdfFrame" class="pdf-frame" src=""></iframe>
      </div>
    </div>

    <div class="admin-modal" id="adminModal">
      <div class="admin-box">
        <h2 style="color:var(--neon-cyan); margin-bottom:20px;">دخول المالك</h2>
        <input type="text" id="adminUser" class="admin-input" placeholder="اسم المستخدم">
        <input type="password" id="adminPass" class="admin-input" placeholder="كلمة المرور">
        <button class="action-btn btn-download" style="width:100%; margin-bottom:10px;" onclick="checkAdminLogin()">دخول</button>
        <div id="adminError" style="color:var(--neon-red); font-size:0.9rem; display:none;">بيانات خاطئة</div>
        <button class="theme-btn" style="width:100%; margin-top:10px;" onclick="document.getElementById('adminModal').style.display='none'">إلغاء</button>
      </div>
    </div>

    <div class="admin-modal" id="adminPanelModal">
      <div class="admin-box">
        <h2 style="color:var(--neon-green); margin-bottom:20px;">لوحة التحكم</h2>
        <input type="text" id="deviceIdInput" class="admin-input" placeholder="NX-XXXXXX">
        <button class="action-btn btn-download" style="width:100%;" onclick="generateCode()">توليد كود</button>

  <script src="https://unpkg.com/gsap@3/dist/gsap.min.js"></script>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyA5Wm1oa680rsox1qcStjq0tD8p84RXtas",
      authDomain: "nexus-store-6cdd9.firebaseapp.com",
      projectId: "nexus-store-6cdd9",
      storageBucket: "nexus-store-6cdd9.firebasestorage.app",
      messagingSenderId: "353860897365",
      appId: "1:353860897365:web:2d011e5e970d8a1f0222dc",
      measurementId: "G-LGMET88R36"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    let isUserLoggedIn = false;
    let pendingAction = null;

    onAuthStateChanged(auth, (user) => {
      if (user) {
        isUserLoggedIn = true;
        document.getElementById('headerUserName').textContent = user.email.split('@')[0];
        if (pendingAction) { pendingAction(); pendingAction = null; }
      } else {
        isUserLoggedIn = false;
        document.getElementById('headerUserName').textContent = 'زائر';
      }
    });

    window.requestLogin = function(actionCallback) {
        pendingAction = actionCallback;
        document.getElementById('loginOverlay').classList.add('active');
        document.body.style.overflow = 'hidden';
    };

    window.closeLoginScreen = function() {
        document.getElementById('loginOverlay').classList.remove('active');
        document.body.style.overflow = 'auto';
        pendingAction = null;
    };

    document.addEventListener("DOMContentLoaded", () => {
      gsap.registerPlugin(Draggable);

      // --- Canvas Background ---
      const canvas = document.getElementById('networkCanvas'), ctx = canvas.getContext('2d');
      let width, height, particles = [];
      function resize() { width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight; }
      window.addEventListener('resize', resize); resize();
      class Particle {
        constructor() { this.x = Math.random() * width; this.y = Math.random() * height; this.vx = (Math.random() - 0.5) * 0.5; this.vy = (Math.random() - 0.5) * 0.5; this.radius = Math.random() * 1.5 + 0.5; }
        update() { this.x += this.vx; this.y += this.vy; if (this.x < 0 || this.x > width) this.vx *= -1; if (this.y < 0 || this.y > height) this.vy *= -1; }
        draw() { ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2); ctx.fillStyle = 'rgba(0, 240, 255, 0.4)'; ctx.fill(); }
      }
      for (let i = 0; i < 50; i++) particles.push(new Particle());
      function animate() { ctx.clearRect(0, 0, width, height); particles.forEach(p => { p.update(); p.draw(); }); requestAnimationFrame(animate); } animate();

      // --- Lamp Logic ---
      const loginOverlay = document.getElementById('loginOverlay');
      const cordBead = document.getElementById("cordBead");
      const cordHit = document.getElementById("cordHit");
      const elasticCord = document.getElementById("elasticCord");
      const shadeAssembly = document.getElementById("shadeAssembly");
      const submitBtn = document.getElementById("submitBtn");
      const btnText = submitBtn.querySelector(".btn-text");
      const btnSpinner = document.getElementById("btnSpinner");
      const btnSuccess = document.getElementById("btnSuccess");
      const userField = document.getElementById("userField");
      const passField = document.getElementById("passField");
      const tabSignIn = document.getElementById("tabSignIn");
      const tabRegister = document.getElementById("tabRegister");

      let isOn = false;
      let activeTab = "signin";
      const REST_X = 245;
      const REST_Y = 300;
      
      gsap.set(cordBead, { x: REST_X, y: REST_Y });

      function renderElasticString(curX, curY) {
        const midX = (245 + curX) / 2;
        const midY = (212 + curY) / 2;
        elasticCord.setAttribute("d", `M 245 212 Q ${midX} ${midY} ${curX} ${curY}`);
      }

      Draggable.create(cordBead, {
        type: "y", bounds: { minY: REST_Y, maxY: REST_Y + 120 },
        onDrag() { renderElasticString(this.x, this.y); gsap.set(shadeAssembly, { rotation: (this.y - REST_Y) * 0.03, transformOrigin: "215px 175px" }); },
        onRelease() {
          if (this.y - REST_Y >= 32) { setLampState(!isOn); }
          gsap.to(cordBead, { y: REST_Y, duration: 1.15, ease: "elastic.out(2.2, 0.16)", onUpdate: () => renderElasticString(REST_X, gsap.getProperty(cordBead, "y")) });
          gsap.to(shadeAssembly, { rotation: 0, duration: 0.7, ease: "back.out(2.2)", transformOrigin: "215px 175px" });
        }
      });

      cordHit.addEventListener("click", () => {
        if(!isOn) { gsap.to(cordBead, { y: REST_Y + 50, duration: 0.2, yoyo: true, repeat: 1, onUpdate: () => renderElasticString(REST_X, gsap.getProperty(cordBead, "y")), onComplete: () => setLampState(true) }); }
      });

      function setLampState(target) {
        isOn = target;
        loginOverlay.setAttribute("data-on", isOn ? "true" : "false");
        if (isOn) {
          setTimeout(() => { loginOverlay.scrollTop = 0; }, 100);
        }
      }

      tabSignIn.addEventListener("click", () => {
        activeTab = "signin"; document.querySelector(".auth-tabs").setAttribute("data-active", "signin");
        tabSignIn.classList.add("active"); tabRegister.classList.remove("active");
        btnText.textContent = "دخول"; document.querySelector(".card-title").textContent = "تسجيل الدخول";
      });
      tabRegister.addEventListener("click", () => {
        activeTab = "register"; document.querySelector(".auth-tabs").setAttribute("data-active", "register");
        tabRegister.classList.add("active"); tabSignIn.classList.remove("active");
        btnText.textContent = "حساب جديد"; document.querySelector(".card-title").textContent = "إنشاء حساب";
      });

      submitBtn.addEventListener("click", (e) => {
        e.preventDefault();
        if (!isOn) { setLampState(true); return; }
        const email = userField.value.trim();
        const password = passField.value;
        if (!email || !password) { alert("الرجاء إدخال البريد وكلمة المرور"); return; }

        btnText.classList.add("hidden"); btnSpinner.classList.remove("hidden");

        if (activeTab === "signin") {
          signInWithEmailAndPassword(auth, email, password)
            .then(() => { btnSpinner.classList.add("hidden"); btnSuccess.classList.remove("hidden"); setTimeout(() => { closeLoginScreen(); btnText.classList.remove("hidden"); btnSuccess.classList.add("hidden"); userField.value=""; passField.value=""; setLampState(false); }, 800); })
            .catch((error) => { alert("خطأ: " + error.message); btnText.classList.remove("hidden"); btnSpinner.classList.add("hidden"); });
        } else {
          createUserWithEmailAndPassword(auth, email, password)
            .then(() => { btnSpinner.classList.add("hidden"); btnSuccess.classList.remove("hidden"); setTimeout(() => { closeLoginScreen(); btnText.classList.remove("hidden"); btnSuccess.classList.add("hidden"); userField.value=""; passField.value=""; setLampState(false); }, 800); })
            .catch((error) => { alert("خطأ: " + error.message); btnText.classList.remove("hidden"); btnSpinner.classList.add("hidden"); });
        }
      });

      // --- Store Logic ---
      const booksData = [
        { id: 1, title: 'حل أوراق البلاغة', type: 'عربي', cat: 'arabic', file: 'book1.pdf', img: 'https://images.unsplash.com/photo-1456513080510-7bf3a84b82f8?q=80&w=400&auto=format&fit=crop' },
        { id: 2, title: 'حل أوراق الصرف', type: 'عربي', cat: 'arabic', file: 'book2.pdf', img: 'https://images.unsplash.com/photo-1456513080510-7bf3a84b82f8?q=80&w=400&auto=format&fit=crop' },
        { id: 3, title: 'اختبار نواس مرن + فتل', type: 'فيزياء', cat: 'science', file: 'book3.pdf', img: 'https://images.unsplash.com/photo-1532012197267-da84d127e765?q=80&w=400&auto=format&fit=crop' },
        { id: 4, title: 'أساس بكلوريا عربي', type: 'عربي', cat: 'arabic', file: 'book4.pdf', img: 'https://images.unsplash.com/photo-1456513080510-7bf3a84b82f8?q=80&w=400&auto=format&fit=crop' },
        { id: 5, title: 'إعراب القصائد', type: 'عربي', cat: 'arabic', file: 'book5.pdf', img: 'https://images.unsplash.com/photo-1456513080510-7bf3a84b82f8?q=80&w=400&auto=format&fit=crop' },
        { id: 6, title: 'الأوراق الذهبية فلسفة', type: 'فلسفة', cat: 'philosophy', file: 'book6.pdf', img: 'https://images.unsplash.com/photo-1544947950-fa07a98d237f?q=80&w=400&auto=format&fit=crop' },
        { id: 7, title: 'الكامل في الفلسفة 2026', type: 'فلسفة', cat: 'philosophy', file: 'book7.pdf', img: 'https://images.unsplash.com/photo-1544947950-fa07a98d237f?q=80&w=400&auto=format&fit=crop' },
        { id: 8, title: 'ترتيب الحوار - فرنسي', type: 'فرنسي', cat: 'languages', file: 'book8.pdf', img: 'https://images.unsplash.com/photo-1524995997946-a1c2e315a42f?q=80&w=400&auto=format&fit=crop' },
        { id: 9, title: 'تلخيص جميع دروس فلسفة', type: 'فلسفة', cat: 'philosophy', file: 'book9.pdf', img: 'https://images.unsplash.com/photo-1544947950-fa07a98d237f?q=80&w=400&auto=format&fit=crop' },
        { id: 11, title: 'دليل 12 أدبي', type: 'دليل', cat: 'arabic', file: 'book11.pdf', img: 'https://images.unsplash.com/photo-1589998059171-988d887df646?q=80&w=400&auto=format&fit=crop' },
        { id: 12, title: 'قواعد الفرنسي', type: 'فرنسي', cat: 'languages', file: 'book12.pdf', img: 'https://images.unsplash.com/photo-1524995997946-a1c2e315a42f?q=80&w=400&auto=format&fit=crop' },
        { id: 13, title: 'مواضيع الإنكليزي (السعادة)', type: 'إنكليزي', cat: 'languages', file: 'book13.pdf', img: 'https://images.unsplash.com/photo-1491841550275-ad7854e35ca6?q=80&w=400&auto=format&fit=crop' },
        { id: 14, title: 'نماذج امتحانية للأزمنة', type: 'إنكليزي', cat: 'languages', file: 'book14.pdf', img: 'https://images.unsplash.com/photo-1491841550275-ad7854e35ca6?q=80&w=400&auto=format&fit=crop' },
        { id: 15, title: 'نموذج فيزياء - نواس ثقلي', type: 'فيزياء', cat: 'science', file: 'book15.pdf', img: 'https://images.unsplash.com/photo-1614849963640-9cc74b2a826f?q=80&w=400&auto=format&fit=crop' },
        { id: 16, title: 'نوطة عربي بكالوريا', type: 'عربي', cat: 'arabic', file: 'book16.pdf', img: 'https://images.unsplash.com/photo-1456513080510-7bf3a84b82f8?q=80&w=400&auto=format&fit=crop' },
        { id: 17, title: 'أحمد الحامض (كل ما تحتاجه وأكثر في الفلسفة)', type: 'فلسفة · Premium', cat: 'philosophy', file: 'book17.pdf', price: 1.5, img: 'https://images.unsplash.com/photo-1589998059171-988d887df646?q=80&w=400&auto=format&fit=crop', premium: true },
        { id: 18, title: 'تاريخ أصفياء الله', type: 'تاريخ', cat: 'philosophy', file: 'book18.pdf', img: 'https://images.unsplash.com/photo-1589998059171-988d887df646?q=80&w=400&auto=format&fit=crop' },
        { id: 19, title: 'شهابي بكالوريا علمي وأدبي (مكثفة قواعد)', type: 'لغات', cat: 'languages', file: 'book19.pdf', img: 'https://images.unsplash.com/photo-1456513080510-7bf3a84b82f8?q=80&w=400&auto=format&fit=crop' },
        { id: 20, title: 'نوطة ديانة أ. أمل حمادة', type: 'تربية إسلامية', cat: 'religion', file: 'book20.pdf', img: 'https://images.unsplash.com/photo-1609599006353-e629aaabfeae?q=80&w=400&auto=format&fit=crop' },
        { id: 21, title: 'مواضيع إنجليزي (حسام سلمان)', type: 'إنكليزي', cat: 'languages', file: 'book21.pdf', img: 'https://images.unsplash.com/photo-1491841550275-ad7854e35ca6?q=80&w=400&auto=format&fit=crop' },
        { id: 22, title: 'نوطة ديانة أ. همام حمدان', type: 'تربية إسلامية', cat: 'religion', file: 'book22.pdf', img: 'https://images.unsplash.com/photo-1584285405429-136bf988919c?q=80&w=400&auto=format&fit=crop' }
      ];

      let favorites = JSON.parse(localStorage.getItem('nexus_favs_v4')) || [];
      let cart = [];

      window.renderHero = function() {
        const heroBook = booksData.find(b => b.id === 17);
        document.getElementById('heroCard').innerHTML = `
          <img src="${heroBook.img}" class="hero-img">
          <div style="flex:1">
            <div style="display:flex; gap:8px; align-items:center; margin-bottom:8px; flex-wrap:wrap;">
              <span style="background:rgba(0,240,255,0.15); color:var(--neon-cyan); font-size:0.7rem; padding:4px 10px; border-radius:10px;">⭐ الأكثر تميزاً</span>
              <span class="premium-badge-tag" style="position:static;">⭐ PREMIUM</span>
              <span style="color:#FFD700; font-weight:900; font-size:1.1rem;">1.5 $</span>
            </div>
            <h2 class="hero-title">${heroBook.title}</h2>
            <p style="font-size:0.8rem; color:var(--text-muted); margin-bottom:12px;">نوطة فلسفة حصرية ومميزة. قريباً كخدمة مدفوعة.</p>
            <button class="hero-btn" onclick="openBookDetails(17)"><i class="fas fa-bolt"></i> استكشف الآن</button>
          </div>
        `;
      };

      window.renderBooks = function(filterCat = 'all') {
        const container = document.getElementById('dynamicSections');
        let html = '';
        const cats = filterCat === 'all' ? ['philosophy', 'arabic', 'science', 'languages', 'religion'] : [filterCat];
        
        cats.forEach(cat => {
          const filtered = booksData.filter(b => b.cat === cat);
          if (filtered.length === 0) return;
          
          const titles = { philosophy: 'قسم الفلسفة', arabic: 'قسم العربي', science: 'قسم العلوم والفيزياء', languages: 'قسم اللغات', religion: 'قسم الديانة' };
          
          html += `<h2 class="section-title">${titles[cat] || cat}</h2><div class="horizontal-scroll">`;
          filtered.forEach(book => {
            const isFav = favorites.includes(book.id);
            html += `
              <div class="book-card" onclick="openBookDetails(${book.id})">
                <div class="book-img-wrap">
                  ${book.premium ? '<span class="premium-badge-tag">⭐ PREMIUM</span>' : ''}
                  <img src="${book.img}" loading="lazy">
                  <div class="fav-icon ${isFav ? 'active' : ''}" onclick="toggleFav(event, ${book.id})"><i class="fas fa-heart"></i></div>
                </div>
                <h3 class="book-title">${book.title}</h3>
                <span class="book-type">${book.type}</span>
              </div>`;
          });
          html += `</div>`;
        });
        container.innerHTML = html;
      };
      
      window.filterCategory = function(cat, btn) {
        document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        window.renderBooks(cat);
      };

      window.toggleFav = function(e, id) {
        e.stopPropagation();
        const idx = favorites.indexOf(id);
        if (idx > -1) favorites.splice(idx, 1);
        else favorites.push(id);
        localStorage.setItem('nexus_favs_v4', JSON.stringify(favorites));
        const activeNav = document.querySelector('.nav-item.active');
        if(activeNav) activeNav.click();
      };

      window.openBookDetails = function(id) {
        const book = booksData.find(b => b.id === id);
        if (!book) return;
        
        // النوطة المميزة
        if (book.premium) {
            let isUnlocked = localStorage.getItem('nexus_premium_unlocked') === 'true';
            let unlockExpiry = parseInt(localStorage.getItem('nexus_premium_expiry') || '0');
            if (Date.now() > unlockExpiry) isUnlocked = false;

            if (!isUnlocked) {

def fetch_router_devices(router_ip, username, password, timeout=5):
    if not router_ip:
        return []
    devices = []
    try:
        auth_bytes = f"{username}:{password}".encode()
        auth = base64.b64encode(auth_bytes).decode()
        endpoints = [
            f"http://{router_ip}/userRpm/AssignedIpAddrListRpm.htm",
            f"http://{router_ip}/cgi-bin/luci/;stok=/locale?form=dhcp_leases",
            f"http://{router_ip}/DHCPClientInfo.htm",
            f"http://{router_ip}/dhcp_clients.html",
        ]
        for url in endpoints:
            try:
                req = urllib.request.Request(url)
                req.add_header("Authorization", f"Basic {auth}")
                req.add_header("User-Agent", "Mozilla/5.0")
                with urllib.request.urlopen(req, timeout=timeout) as resp:
                    html = resp.read().decode("utf-8", errors="ignore")
                    ips = re.findall(r'\b(?:192\.168|10\.0|172\.(?:1[6-9]|2\d|3[01]))\.\d+\.\d+\b', html)
                    macs = re.findall(r'\b(?:[0-9A-Fa-f]{2}[:-]){5}[0-9A-Fa-f]{2}\b', html)
                    if ips and macs:
                        for i, ip in enumerate(set(ips)):
                            mac = macs[i].upper().replace("-", ":") if i < len(macs) else "??:??:??:??:??:??"
                            devices.append({"ip": ip, "mac": mac})
                        if devices:
                            break
            except Exception:
                continue
    except Exception:
        pass
    return devices

class SoundBank:
    def __init__(self):
        self.ok = False
        try:
            pygame.mixer.pre_init(22050, -16, 1, 512)
            pygame.mixer.init()
            self.ok = True
        except Exception:
            self.ok = False
            return
        self.alert = self._tone(880, 0.2, 0.5)
        self.beep = self._tone(1200, 0.08, 0.3)
        self.success = self._tone(660, 0.15, 0.4)
    def _tone(self, freq, dur, vol):
        try:
            sr = 22050
            n = int(sr * dur)
            buf = array.array('h')
            for i in range(n):
                t = i / sr
                env = max(0.0, 1.0 - (i / n))
                v = int(32767 * vol * env * math.sin(2 * math.pi * freq * t))
                buf.append(v)
            return pygame.mixer.Sound(buffer=buf.tobytes())
        except Exception:
            return None
    def play(self, name):
        if not self.ok: return
        s = getattr(self, name, None)
        if s: s.play()

def get_ttl(ip):
    try:
        r = subprocess.run(["ping", "-c", "1", "-W", "1", ip],
                           stdout=subprocess.PIPE, stderr=subprocess.DEVNULL,
                           timeout=3)
        if r.returncode != 0: return None
        out = r.stdout.decode("utf-8", errors="ignore")
        m = re.search(r"ttl=(\d+)", out, re.IGNORECASE)
        if m: return int(m.group(1))
        return None
    except Exception:
        return None

def ttl_to_os(ttl):
    if ttl is None: return "Unknown"
    if ttl <= 32: return "Embedded/Printer"
    if ttl <= 64:
        if ttl >= 60: return "Linux/Android"
        return "Linux/Embedded"
    if ttl <= 128: return "Windows"
    if ttl <= 255:
        if ttl >= 250: return "Cisco/Router"
        return "Router/Network"
    return "Unknown"

    if "samsung" in vendor: return "Samsung Device"

    if "sonos" in vendor: return "Sonos Speaker"

                                   "asus", "belkin", "ubiquiti", "cisco"]):
        return "Network Device"
    if "intel" in vendor: return "PC/Laptop (Intel)"

        if 120 <= ttl <= 128: return "Windows"
        if ttl >= 250: return "Router/Switch"
        if ttl <= 32: return "Embedded Device"
    return "Unknown Device"

def ssdp_discover(timeout=2):
    devices = {}
    try:
        sock = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
        sock.settimeout(timeout)
        sock.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
        msg = ('M-SEARCH * HTTP/1.1\r\nHOST: 239.255.255.250:1900\r\n'
               'MAN: "ssdp:discover"\r\nMX: 2\r\nST: ssdp:all\r\n\r\n').encode()
        sock.sendto(msg, ("239.255.255.250", 1900))
        start = time.time()
        while time.time() - start < timeout:
            try:
                data, addr = sock.recvfrom(4096)
                ip = addr[0]
                text = data.decode("utf-8", errors="ignore")
                server, st = "", ""
                for line in text.split("\r\n"):
                    if line.lower().startswith("server:"): server = line.split(":", 1)[1].strip()
                    if line.lower().startswith("st:"): st = line.split(":", 1)[1].strip()
                if ip not in devices:
                    devices[ip] = {"server": server[:60], "st": st[:60]}
            except socket.timeout:
                break
            except Exception:
                continue
        sock.close()
    except Exception:
        pass
    return devices

def mdns_discover(timeout=2):
    devices = {}
    try:
        sock = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
        sock.settimeout(timeout)
        sock.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
        query = struct.pack("!HHHHHH", 0, 0, 1, 0, 0, 0)
        for part in ["_services", "_dns-sd", "_udp", "local"]:
            query += bytes([len(part)]) + part.encode()
        query += b"\x00"
        query += struct.pack("!HH", 12, 1)
        sock.sendto(query, ("224.0.0.251", 5353))
        start = time.time()
        while time.time() - start < timeout:
            try:
                data, addr = sock.recvfrom(4096)
                devices[addr[0]] = {"size": len(data)}
            except socket.timeout:
                break
            except Exception:
                continue
        sock.close()
    except Exception:
        pass
    return devices

def netbios_query(ip, timeout=1):
    try:
        sock = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
        sock.settimeout(timeout)
        tid = random.randint(0, 65535)
        packet = struct.pack("!HHHHHH", tid, 0x0000, 1, 0, 0, 0)
        packet += bytes([32]) + b"CKAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA" + b"\x00"
        packet += struct.pack("!HH", 0x21, 0x0001)
        sock.sendto(packet, (ip, 137))
        try:
            data, _ = sock.recvfrom(1024)
            if len(data) > 56:
                num_names = data[56]
                if num_names > 0:
                    name_bytes = data[57:57+15]
                    try:
                        name = name_bytes.decode("ascii", errors="ignore").strip()
                        if name: return name
                    except Exception:
                        pass
        except socket.timeout:
            pass
        sock.close()
    except Exception:
        pass
    return None

def http_grab(ip, port=80, timeout=1.5):
    try:
        sock = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
        sock.settimeout(timeout)
        sock.connect((ip, port))
        req = f"HEAD / HTTP/1.0\r\nHost: {ip}\r\n\r\n".encode()
        sock.sendall(req)
        data = b""
        start = time.time()
        while time.time() - start < timeout:
            chunk = sock.recv(1024)
            if not chunk: break
            data += chunk
            if b"\r\n\r\n" in data: break
        sock.close()
        text = data.decode("utf-8", errors="ignore")
        info = {}
        for line in text.split("\r\n"):
            if line.lower().startswith("server:"): info["server"] = line.split(":", 1)[1].strip()[:60]
            if line.lower().startswith("x-powered-by:"): info["powered_by"] = line.split(":", 1)[1].strip()[:60]
        return info
    except Exception:
        return {}

def banner_grab(ip, port, timeout=1.5):
    try:
        sock = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
        sock.settimeout(timeout)
        sock.connect((ip, port))
        try:
            data = sock.recv(512)
            sock.close()
            return data.decode("utf-8", errors="ignore").strip()[:80]
        except Exception:
            sock.close()
            return None
    except Exception:
        return None

    def get_my_ip(self):
        try:

            s.settimeout(1)
            s.connect(("8.8.8.8", 80))
            ip = s.getsockname()[0]
            s.close()
            return ip
        except Exception:
            return None

    def get_router_ip(self):
        if not self.my_ip: return None
        return ".".join(self.my_ip.split(".")[:3]) + ".1"

    def read_arp_table(self):
        arp = {}
        try:
            with open("/proc/net/arp", "r") as f:
                for line in f.readlines()[1:]:
                    parts = line.split()
                    if len(parts) >= 4:
                        ip, mac = parts[0], parts[3]
                        if mac != "00:00:00:00:00:00":
                            arp[ip] = mac.upper()
        except Exception:
            pass
        return arp

    def ping(self, ip):
        try:
            r = subprocess.run(["ping", "-c", "1", "-W", "1", ip],
                               stdout=subprocess.DEVNULL,
                               stderr=subprocess.DEVNULL, timeout=2)
            return r.returncode == 0
        except Exception:
            return False

    def ping_detailed(self, ip):
        try:
            r = subprocess.run(["ping", "-c", "3", "-W", "1", ip],
                               stdout=subprocess.PIPE,
                               stderr=subprocess.DEVNULL, timeout=5)
            if r.returncode != 0:
                return (False, 0, 100)
            out = r.stdout.decode("utf-8", errors="ignore")
            times = re.findall(r"time[=<]([\d.]+)\s*ms", out)
            loss_m = re.search(r"(\d+)%\s*packet loss", out)
            loss = int(loss_m.group(1)) if loss_m else 0
            if times:
                return (True, round(sum(float(t) for t in times) / len(times), 1), loss)
            return (True, 0, loss)
        except Exception:
            return (False, 0, 100)

    def get_hostname(self, ip):
        try:
            socket.setdefaulttimeout(1)
            return socket.gethostbyaddr(ip)[0]
        except Exception:
            return ""

    def scan_worker(self, ip_list):
        for ip in ip_list:
            if self.stop_flag: return
            if self.ping(ip):
                with self.lock:
                    arp = self.read_arp_table()
                    mac = arp.get(ip, "??:??:??:??:??:??")
                    if mac == "??:??:??:??:??:??":
                        rd = self.user_data.get("router_devices", {})
                        if ip in rd: mac = rd[ip]
                    hostname = self.get_hostname(ip)
                    ttl = get_ttl(ip)
                    os_guess = ttl_to_os(ttl)
                    ports = []
                    if ip not in (self.router_ip, self.my_ip):
                        try: ports = self.scan_ports(ip)
                        except Exception: ports = []
                    device_type = detect_device_type(mac, hostname, ports, ttl)
                    vendor = lookup_vendor(mac)
                    dangerous = [p for p in ports if p in DANGEROUS_PORTS]
                    http_info = {}
                    if 80 in ports: http_info = http_grab(ip, 80)
                    elif 8080 in ports: http_info = http_grab(ip, 8080)
                    banners = {}
                    for p in ports[:5]:
                        if p in (21, 22, 25, 110, 143, 993, 995):
                            b = banner_grab(ip, p)
                            if b: banners[p] = b
                    netbios = netbios_query(ip) if ip not in (self.router_ip, self.my_ip) else None
                    rev_dns = reverse_dns(ip)
                    try: ok, ping_ms, loss = self.ping_detailed(ip)
                    except Exception: ping_ms, loss = 0, 0
                    uptime_guess = "Unknown"
                    if ping_ms > 0:
                        if ping_ms < 5: uptime_guess = "Recent boot"
                        elif ping_ms < 20: uptime_guess = "Running"
                        else: uptime_guess = "Long uptime"
                    known = self.user_data.get("known_devices", {}).get(mac)
                    is_trusted = known is not None and known.get("trusted", False)
                    custom_name = known.get("name", "") if known else ""
                    if not custom_name:
                        custom_name = netbios or hostname or vendor or "Unknown"
                    if ip not in self.ping_history: self.ping_history[ip] = []
                    self.ping_history[ip].append(ping_ms)
                    if len(self.ping_history[ip]) > 50:
                        self.ping_history[ip] = self.ping_history[ip][-50:]
                    device = {
                        "ip": ip, "mac": mac,
                        "name": hostname if hostname else vendor,
                        "netbios": netbios or "",
                        "custom_name": custom_name,
                        "vendor": vendor, "type": device_type,
                        "os": os_guess, "ttl": ttl if ttl else 0,
                        "ports": ports,
                        "services": [lookup_service(p) for p in ports[:10]],
                        "dangerous_ports": dangerous,
                        "http_info": http_info, "banners": banners,
                        "ping": ping_ms, "loss": loss,
                        "trusted": is_trusted, "uptime": uptime_guess,
                        "reverse_dns": rev_dns or "",
                        "first_seen": datetime.now().strftime("%Y-%m-%d %H:%M:%S"),
                        "kind": "me" if ip == self.my_ip else (
                            "router" if ip == self.router_ip else "unknown"),
                    }
                    if not [d for d in self.devices if d["ip"] == ip]:
                        self.devices.append(device)
                        if device["kind"] == "unknown" and not is_trusted \
                           and mac != "??:??:??:??:??:??":
                            self.new_device_mac = mac
                            self.new_device_alert_timer = 300
                            if not self.ghost_mode and self.user_data.get("sound", True):
                                self.sounds.play("alert")
                            self.history.append({
                                "time": datetime.now().strftime("%Y-%m-%d %H:%M:%S"),
                                "event": "new_device", "ip": ip,
                                "mac": mac, "name": custom_name,
                            })
                            save_history(self.history)
                        if dangerous:
                            self.history.append({
                                "time": datetime.now().strftime("%Y-%m-%d %H:%M:%S"),
                                "event": "dangerous_ports", "ip": ip,
                                "mac": mac, "name": f"{len(dangerous)} open",
                            })
                            save_history(self.history)
            with self.lock:
                self.progress += 1

    def start_scan(self):
        if self.scanning: return
        self.devices = []
        self.progress = 0
        self.stop_flag = False
        self.scanning = True
        def extra_discovery():
            try: self.ssdp_devices = ssdp_discover(timeout=2)
            except Exception: pass
            try: self.mdns_devices = mdns_discover(timeout=2)
            except Exception: pass
        threading.Thread(target=extra_discovery, daemon=True).start()
        priority = [self.router_ip] if self.router_ip else []
        priority.append(self.my_ip)
        priority = [ip for ip in priority if ip]
        others = [f"{self.subnet}.{i}" for i in range(2, 255)]
        others = [ip for ip in others if ip not in priority]
        all_ips = priority + others
        cs = max(1, len(all_ips) // 6)
        chunks = [all_ips[i:i + cs] for i in range(0, len(all_ips), cs)]
        for c in chunks:
            threading.Thread(target=self.scan_worker, args=(c,), daemon=True).start()

    def deep_scan(self, device):
        self.deep_scanning = True
        try:
            ip = device["ip"]
            ports = self.scan_ports_full(ip)
            device["ports"] = ports
            device["services"] = [lookup_service(p) for p in ports]
            device["dangerous_ports"] = [p for p in ports if p in DANGEROUS_PORTS]
            http_info = {}
            for p in [80, 8080, 8000, 8008, 8443, 443, 8888]:
                if p in ports:
                    info = http_grab(ip, p)
                    if info: http_info[p] = info
            device["http_info"] = http_info
            banners = {}
            for p in ports[:15]:
                b = banner_grab(ip, p)
                if b: banners[p] = b
            device["banners"] = banners
        except Exception:
            pass
        self.deep_scanning = False

    def stop_scan(self): self.stop_flag = True
    def is_done(self):
        if not self.scanning: return False
        return self.progress >= self.max_progress

def draw_text_neon(surf, text, font, pos, color, glow=True, center=False):
    if center:
        base = font.render(text, True, color)
        rect = base.get_rect(center=pos)
    else:
        base = font.render(text, True, color)
        rect = base.get_rect(topleft=pos)
    if glow:
        gc = tuple(min(255, int(c * 0.5)) for c in color)
        for dx, dy in [(-1, 0), (1, 0), (0, -1), (0, 1)]:
            surf.blit(font.render(text, True, gc), (rect.x+dx, rect.y+dy),
                      special_flags=pygame.BLEND_ADD)
    surf.blit(base, rect)
    return rect

def draw_panel(surf, rect, border_color=None, fill_alpha=200):
    if border_color is None: border_color = C("cyan")
    panel = pygame.Surface((rect.w, rect.h), pygame.SRCALPHA)
    panel.fill((*C("panel"), fill_alpha))
    surf.blit(panel, rect.topleft)
    for i in range(3):
        alpha = 100 - i * 30
        glow = pygame.Surface((rect.w + i*4, rect.h + i*4), pygame.SRCALPHA)
        pygame.draw.rect(glow, (*border_color, alpha),
                         (0, 0, rect.w + i*4, rect.h + i*4), 2, border_radius=8)
        surf.blit(glow, (rect.x - i*2, rect.y - i*2))
    pygame.draw.rect(surf, border_color, rect, 2, border_radius=8)

class NeonButton:
    def __init__(self, rect, text, action, color_key="cyan"):
        self.rect = rect
        self.text = text
        self.action = action
        self.color_key = color_key
        self.pressed = False
        self.flash = 0
    @property
    def color(self): return C(self.color_key)
    def handle(self, e):
        if e.type == pygame.FINGERDOWN:
            x, y = e.x * SCREEN_W, e.y * SCREEN_H
            if self.rect.collidepoint(x, y):
                self.pressed = True; self.flash = 15; return True
        elif e.type == pygame.FINGERUP: self.pressed = False
        elif e.type == pygame.MOUSEBUTTONDOWN:
            if self.rect.collidepoint(*e.pos):
                self.pressed = True; self.flash = 15; return True
        elif e.type == pygame.MOUSEBUTTONUP: self.pressed = False
        return False
    def draw(self, surf):
        if self.flash > 0: self.flash -= 1
        base = self.color
        if self.pressed: base = tuple(min(255, c+60) for c in base)
        gi = 3 if self.flash > 0 else 1
        for i in range(gi, 0, -1):
            alpha = 40 if self.flash > 0 else 20
            glow = pygame.Surface((self.rect.w+i*6, self.rect.h+i*6), pygame.SRCALPHA)
            pygame.draw.rect(glow, (*base, alpha),
                             (0, 0, self.rect.w+i*6, self.rect.h+i*6), border_radius=12)
            surf.blit(glow, (self.rect.x-i*3, self.rect.y-i*3))
        pygame.draw.rect(surf, C("btn_bg"), self.rect, border_radius=10)
        pygame.draw.rect(surf, base, self.rect, 3, border_radius=10)
        txt = _FONT_MED.render(self.text, True, base)
        surf.blit(txt, txt.get_rect(center=self.rect.center))

def show_history(screen, clock):
    history = load_history()
    scroll = 0
    while True:
        screen.fill(C("bg"))
        for x in range(0, SCREEN_W, 40): pygame.draw.line(screen, C("grid"), (x, 0), (x, SCREEN_H), 1)
        for y in range(0, SCREEN_H, 40): pygame.draw.line(screen, C("grid"), (0, y), (SCREEN_W, y), 1)
        draw_text_neon(screen, "HISTORY LOG", _FONT_BIG, (SCREEN_W//2, 40), C("cyan"), center=True)
        panel = pygame.Rect(int(SCREEN_W*0.05), int(SCREEN_H*0.13), int(SCREEN_W*0.90), int(SCREEN_H*0.72))
        draw_panel(screen, panel)
        pad = 15
        inner_y = panel.y + pad
        inner_h = panel.h - pad*2 - 50
        clip = pygame.Rect(panel.x+pad, inner_y, panel.w-pad*2, inner_h)
        old = screen.get_clip()
        screen.set_clip(clip)
        row_h = max(26, int(SCREEN_H*0.04))
        items = list(reversed(history))
        for i, item in enumerate(items):
            y = inner_y + i*row_h - scroll
            if y+row_h < inner_y or y > inner_y+inner_h: continue
            ev = item.get("event", "")
            if ev == "new_device": col = C("red")
            elif ev == "dangerous_ports": col = C("yellow")
            else: col = C("green")
            txt = f"[{item.get('time','')}] {ev.upper()}: {item.get('ip','')} / {item.get('name','')}"
            t = _FONT_MONO.render(txt, True, col)
            screen.blit(t, (inner_y, y))
        screen.set_clip(old)
        if not history:
            t = _FONT_MED.render("No history", True, C("text_dim"))
            screen.blit(t, t.get_rect(center=panel.center))
        back = NeonButton(pygame.Rect(panel.centerx-100, panel.bottom-55, 200, 42), "BACK", "back", "cyan")
        back.draw(screen)
        pygame.display.flip()
        for e in pygame.event.get():
            if e.type == pygame.QUIT: return
            if e.type == pygame.KEYDOWN and e.key == pygame.K_ESCAPE: return
            if e.type == pygame.MOUSEWHEEL:
                scroll -= e.y*30
                scroll = max(0, min(scroll, max(0, len(items)*row_h - inner_h)))
            elif e.type == pygame.MOUSEBUTTONDOWN:
                if back.handle(e): return
            elif e.type == pygame.FINGERDOWN:
                x, y = e.x*SCREEN_W, e.y*SCREEN_H
                if back.rect.collidepoint(x, y): return
        clock.tick(30)

def show_speed_test(screen, clock, scanner):
    result = None
    testing = False
    def run():
        nonlocal result, testing
        testing = True
        try:
            start = time.time()
            s = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
            s.settimeout(10)
            s.connect(("1.1.1.1", 80))
            s.sendall(b"GET / HTTP/1.0\r\nHost: 1.1.1.1\r\n\r\n")
            total = 0
            while time.time() - start < 5:
                data = s.recv(65536)
                if not data: break
                total += len(data)
                if total > 3_000_000: break
            el = time.time() - start
            s.close()
            dl = round((total * 8) / (el * 1_000_000), 2)
            _, ping_ms, _ = scanner.ping_detailed("1.1.1.1")
            result = {"download": dl, "ping": ping_ms}
        except Exception as ex:
            result = {"download": 0, "ping": 0, "error": str(ex)[:40]}
        testing = False
    threading.Thread(target=run, daemon=True).start()
    while True:
        screen.fill(C("bg"))
        for x in range(0, SCREEN_W, 40): pygame.draw.line(screen, C("grid"), (x, 0), (x, SCREEN_H), 1)
        for y in range(0, SCREEN_H, 40): pygame.draw.line(screen, C("grid"), (0, y), (SCREEN_W, y), 1)
        draw_text_neon(screen, "SPEED TEST", _FONT_BIG, (SCREEN_W//2, 40), C("cyan"), center=True)
        panel = pygame.Rect(int(SCREEN_W*0.15), int(SCREEN_H*0.20), int(SCREEN_W*0.70), int(SCREEN_H*0.55))
        draw_panel(screen, panel)
        if testing:
            t = _FONT_BIG.render("Testing...", True, C("yellow"))
            screen.blit(t, t.get_rect(center=panel.center))
        elif result:
            y = panel.y + 40
            items = [
                ("Download", f"{result.get('download', 0)} Mbps", "green"),
                ("Ping", f"{result.get('ping', 0)} ms", "cyan"),
            ]
            for label, value, col in items:
                lt = _FONT_MED.render(label, True, C("text"))
                screen.blit(lt, (panel.x+40, y))
                vt = _FONT_BIG.render(value, True, C(col))
                screen.blit(vt, (panel.right-300, y-8))
                y += 60
            if result.get("error"):
                t = _FONT_SMALL.render(result["error"], True, C("red"))
                screen.blit(t, (panel.x+40, y))
        else:
            t = _FONT_MED.render("Starting...", True, C("text_dim"))
            screen.blit(t, t.get_rect(center=panel.center))
        back = NeonButton(pygame.Rect(panel.centerx-100, panel.bottom-60, 200, 45), "BACK", "back", "cyan")
        back.draw(screen)
        pygame.display.flip()
        for e in pygame.event.get():
            if e.type == pygame.QUIT: return
            if e.type == pygame.KEYDOWN and e.key == pygame.K_ESCAPE: return
            elif e.type == pygame.MOUSEBUTTONDOWN:
                if back.handle(e): return
            elif e.type == pygame.FINGERDOWN:
                x, y = e.x*SCREEN_W, e.y*SCREEN_H
                if back.rect.collidepoint(x, y): return
        clock.tick(30)

def build_buttons():

    bm = int(SCREEN_H*0.02)
    gx = int(SCREEN_W*0.010)
    gy = int(SCREEN_H*0.008)
    is_portrait = SCREEN_H > SCREEN_W
    if is_portrait:
        bw = (SCREEN_W - sm*2 - gx) // 2
        bh = int(SCREEN_H*0.042)
        th = bh*8 + gy*7
        top = SCREEN_H - bm - th
        x1, x2 = sm, sm + bw + gx
        def B(x, r, text, action, color):
            return NeonButton(pygame.Rect(x, top + r*(bh+gy), bw, bh), text, action, color)
        return [
            B(x1, 0, "SCAN", "scan", "cyan"),
            B(x2, 0, "STOP", "stop", "red"),
            B(x1, 1, "ROUTER", "router", "cyan"),
            B(x2, 1, "HISTORY", "history", "purple"),
            B(x1, 2, "STATS", "stats", "yellow"),
            B(x2, 2, "MAP", "graph", "blue"),
            B(x1, 3, "SPEED", "speed", "blue"),
            B(x2, 3, "EXPORT HTML", "export_html", "green"),
            B(x1, 4, "EXPORT CSV", "export_csv", "green"),
            B(x2, 4, "BACKUP", "backup", "green"),
            B(x1, 5, "THEME", "theme", "cyan"),
            B(x2, 5, "GHOST", "ghost", "purple"),
            B(x1, 6, "AUTO", "auto", "yellow"),
            B(x2, 6, "HELP", "help", "blue"),
            B(x1, 7, "ABOUT", "about", "purple"),
            B(x2, 7, "EXIT", "exit", "red"),
        ]
    else:
        bw = (SCREEN_W - sm*2 - gx*3) // 4
        bh = int(SCREEN_H*0.062)
        th = bh*4 + gy*3
        top = SCREEN_H - bm - th
        x0 = sm
        def B(col, row, text, action, color):
            x = x0 + col*(bw+gx)
            y = top + row*(bh+gy)
            return NeonButton(pygame.Rect(x, y, bw, bh), text, action, color)
        return [
            B(0, 0, "SCAN", "scan", "cyan"),
            B(1, 0, "STOP", "stop", "red"),
            B(2, 0, "ROUTER", "router", "cyan"),
            B(3, 0, "HISTORY", "history", "purple"),
            B(0, 1, "STATS", "stats", "yellow"),
            B(1, 1, "NETWORK MAP", "graph", "blue"),
            B(2, 1, "SPEED TEST", "speed", "blue"),
            B(3, 1, "BACKUP", "backup", "green"),
            B(0, 2, "EXPORT HTML", "export_html", "green"),
            B(1, 2, "EXPORT CSV", "export_csv", "green"),
            B(2, 2, "THEME", "theme", "cyan"),
            B(3, 2, "GHOST", "ghost", "purple"),
            B(0, 3, "AUTO", "auto", "yellow"),
            B(1, 3, "HELP", "help", "blue"),
            B(2, 3, "ABOUT", "about", "purple"),
            B(3, 3, "EXIT", "exit", "red"),
        ]

def show_help(screen, clock):
    while True:
        screen.fill(C("bg"))
        for x in range(0, SCREEN_W, 40): pygame.draw.line(screen, C("grid"), (x, 0), (x, SCREEN_H), 1)
        for y in range(0, SCREEN_H, 40): pygame.draw.line(screen, C("grid"), (0, y), (SCREEN_W, y), 1)
        draw_text_neon(screen, "HELP", _FONT_BIG, (SCREEN_W//2, 40), C("cyan"), center=True)
        panel = pygame.Rect(int(SCREEN_W*0.08), int(SCREEN_H*0.13), int(SCREEN_W*0.84), int(SCREEN_H*0.72))
        draw_panel(screen, panel)
        lines = [
            "SCAN        - Scan network",
            "STOP        - Stop scan",
            "ROUTER      - Router Integration (fetch MACs)",
            "SPEED       - Internet speed test",
            "HISTORY     - Event log",
            "STATS       - Statistics",
            "MAP         - Circular view",
            "EXPORT HTML - Web report",
            "EXPORT CSV  - Excel file",
            "BACKUP      - JSON backup",
            "THEME       - Toggle colors",
            "GHOST       - Silent scan",
            "AUTO        - Auto scan every 30s",
            "",
            "TAP device for full details:",
            "OS, Type, Ports, Banners, SSDP",
            "",
            "DEEP SCAN for 100+ ports",
            "",
            "ROUTER: use presets if keyboard",
            "does not appear on your device.",
        ]
        y = panel.y + 20
        for line in lines:
            col = C("yellow") if (line and line[0].isupper() and len(line) > 3 and line[1:4].strip()) else C("text")
            t = _FONT_MONO.render(line, True, col)
            screen.blit(t, (panel.x+30, y))
            y += 26
        back = NeonButton(pygame.Rect(panel.centerx-100, panel.bottom-55, 200, 42), "BACK", "back", "cyan")
        back.draw(screen)
        pygame.display.flip()
        for e in pygame.event.get():
            if e.type == pygame.QUIT: return
            if e.type == pygame.KEYDOWN and e.key == pygame.K_ESCAPE: return
            elif e.type == pygame.MOUSEBUTTONDOWN:
                if back.handle(e): return
            elif e.type == pygame.FINGERDOWN:
                x, y = e.x*SCREEN_W, e.y*SCREEN_H
                if back.rect.collidepoint(x, y): return
        clock.tick(30)

def show_about(screen, clock):
    while True:
        screen.fill(C("bg"))
        for x in range(0, SCREEN_W, 40): pygame.draw.line(screen, C("grid"), (x, 0), (x, SCREEN_H), 1)
        for y in range(0, SCREEN_H, 40): pygame.draw.line(screen, C("grid"), (0, y), (SCREEN_W, y), 1)
        draw_text_neon(screen, "ABOUT", _FONT_BIG, (SCREEN_W//2, 40), C("cyan"), center=True)
        panel = pygame.Rect(int(SCREEN_W*0.10), int(SCREEN_H*0.20), int(SCREEN_W*0.80), int(SCREEN_H*0.55))
        draw_panel(screen, panel)
        lines = [
            ("Network Scanner ULTIMATE V4", C("cyan")),
            ("", C("text")),
            ("40+ Professional Features", C("green")),
            ("", C("text")),
            ("* OS Fingerprinting (TTL)", C("text")),
            ("* Device Type Detection", C("text")),
            ("* Deep Port Scanning", C("text")),
            ("* Service Detection", C("text")),
            ("* SSDP / mDNS / NetBIOS", C("text")),

            ("* Router Integration", C("text")),

        ]
